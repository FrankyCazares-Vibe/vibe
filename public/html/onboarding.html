// ── Step 2: campus ────────────────────────────────────────────────────────
/** Cards for the current university (rebuilt when the Purdue switch changes it). */
function renderCampusCards() {
  const system = onb.system;
  const group = $('onbCampusGroup');
  group.textContent = '';
  $('onbCampusOtto').textContent = system === 'purdue' ? ONB_COPY.campus.ottoPurdue : ONB_COPY.campus.ottoIu;
  // No university yet: the phone shows only the title and the missing line.
  $('onbCampusOtto').hidden = system === null;
  $('onbSystemMissing').hidden = system !== null;
  group.hidden = system === null;
  $('onbCampusNote').hidden = system === null;
  if (system === null) {
    renderPurdue();
    return;
  }
  const label = SYSTEM_LABEL[system];
  $('onbCampusNote').textContent = ONB_COPY.campus.note.replace(/\{system\}/g, () => label);
  const pre = preselectId();
  campusesForSystem(system).forEach((c) => {
    const card = document.createElement('label');
    card.className = 'campus-card';
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'onb-campus';
    radio.value = c.id;
    radio.addEventListener('change', () => onPickCampus(c.id));
    const text = document.createElement('span');
    text.className = 'campus-text';
    const titleRow = document.createElement('span');
    titleRow.className = 'campus-title-row';
    const title = document.createElement('span');
    title.className = 'campus-title';
    title.textContent = c.shortName;
    titleRow.appendChild(title);
    if (c.id === pre) {
      const tag = document.createElement('span');
      tag.className = 'campus-tag';
      tag.textContent = ONB_COPY.campus.fromEmailTag;
      titleRow.appendChild(tag);
    }
    if (!c.isOpen) {
      const soon = document.createElement('span');
      soon.className = 'campus-soon';
      soon.textContent = ONB_COPY.campus.notOpen;
      titleRow.appendChild(soon);
    }
    const sub = document.createElement('span');
    sub.className = 'campus-sub';
    sub.textContent = campusPickerSub(c, system);
    text.appendChild(titleRow);
    text.appendChild(sub);
    card.appendChild(radio);
    card.appendChild(text);
    group.appendChild(card);
  });
  syncCampusCards();
  bindCursorHover();
}

function syncCampusCards() {
  const busy = isBusy();
  document.querySelectorAll('#onbCampusGroup .campus-card').forEach((card) => {
    const radio = card.querySelector('input');
    const selected = radio.value === onb.campusId;
    radio.checked = selected;
    radio.disabled = busy;
    card.classList.toggle('selected', selected);
  });
  renderPurdue();
}

function setCampusError(text) {
  const el = $('onbCampusError');
  const group = $('onbCampusGroup');
  el.textContent = text || '';
  el.hidden = !text;
  if (text) {
    group.setAttribute('aria-invalid', 'true');
    group.setAttribute('aria-describedby', 'onbCampusError');
  } else {
    group.removeAttribute('aria-invalid');
    group.setAttribute('aria-describedby', 'onbCampusNote');
  }
}

function revealCampus() {
  $('onbCampusGroup').scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function onPickCampus(id) {
  if (isBusy()) return;
  onb.campusId = id;
  setCampusError('');
  syncCampusCards();
  refreshMajorList();
  scheduleDraft();
}

/** A new confirmed campus means new clubs and people. */
function markCampusSaved(id) {
  if (id === onb.savedCampusId) return;
  onb.savedCampusId = id;
  resetSocial();
}

async function continueCampus() {
  if (isBusy()) return;
  // No university on record: there's nothing to pick yet.
  if (onb.system === null) {
    goForward(3);
    return;
  }
  if (!onb.campusId || !campusAllowed(onb.campusId, onb.system)) {
    setCampusError(onb.campusId ? ONB_COPY.campus.invalid : ONB_COPY.campus.required);
    revealCampus();
    return;
  }
  // Replay writes nothing, and an unchanged pick would only spend the step
  // route's limiter (shared with profile saves).
  if (IS_REPLAY || onb.campusId === onb.savedCampusId) {
    goForward(3);
    return;
  }
  const picked = onb.campusId;
  setBusy('savingCampus', true);
  const r = await postCampus(picked);
  setBusy('savingCampus', false);
  if (r.ok) {
    markCampusSaved(picked);
    goForward(3);
    return;
  }
  if (CAMPUS_FIELD_CODES.includes(r.code)) {
    setCampusError(r.error || ONB_COPY.campus.invalid);
    revealCampus();
    return;
  }
  toastFailure(r);
}

// ── The @purdue.edu switch (Q8) ───────────────────────────────────────────
const PURDUE_EMAIL_RE = /^[^\s@]+@purdue\.edu$/i;

function setPurdueMsg(text) {
  const el = $('onbPurdueMsg');
  el.textContent = text || '';
  el.hidden = !text;
}

function renderPurdue() {
  const show = onb.system === 'iu' && onb.campusId === 'indianapolis';
  // The panel belongs to the link: once Indianapolis isn't picked, it closes.
  if (!show && onb.purdue.open && !onb.purdue.sending && !onb.purdue.verifying) closePurdue();
  const p = onb.purdue;
  const working = p.sending || p.verifying;
  $('onbPurdueLink').hidden = !show || p.open;
  $('onbPurdueSwitch').hidden = !show || !p.open;
  $('onbPurdueEmail').disabled = working || p.sent;
  const send = $('onbPurdueSend');
  send.hidden = p.sent;
  send.disabled = working;
  send.textContent = p.sending ? ONB_COPY.campus.switchSending : ONB_COPY.campus.switchSend;
  $('onbPurdueCodeRow').hidden = !p.sent;
  const code = $('onbPurdueCode');
  code.disabled = working;
  const verify = $('onbPurdueVerify');
  verify.disabled = working || code.value.length !== 8;
  verify.textContent = p.verifying ? ONB_COPY.campus.switchVerifying : ONB_COPY.campus.switchVerify;
  $('onbPurdueCancel').disabled = working;
}

function closePurdue() {
  onb.purdue = { open: false, sent: false, sending: false, verifying: false };
  $('onbPurdueEmail').value = '';
  $('onbPurdueCode').value = '';
  setPurdueMsg('');
}

/** The university the new code proved: new cards, and a campus pick only if it's still allowed. */
function onSystemChanged(next) {
  onb.system = next.system;
  if (!campusAllowed(onb.campusId, next.system)) onb.campusId = '';
  // A kept shared campus isn't confirmed by the switch, so it stays saved only
  // when the server still has exactly this campus.
  const saved = onb.savedCampusId;
  onb.savedCampusId =
    saved !== null && campusAllowed(saved, next.system) && saved === next.currentCampusId ? saved : null;
  setCampusError('');
  resetSocial();
  renderCampusCards();
  refreshMajorList();
  scheduleDraft();
}

function setPurdueWorking(key, value) {
  onb.purdue[key] = value;
  setBusy('switching', onb.purdue.sending || onb.purdue.verifying);
}

/** After a verified code: read the university back, else reload into the new boot. */
async function rereadCampuses() {
  const r = await window.vibeRequest('/api/campuses', {
    quiet: true,
    failure: ONB_LOCAL_COPY.campusesLoadFailed,
  });
  if (r.ok && isSchoolSystem(r.data.system)) {
    onSystemChanged({
      system: r.data.system,
      currentCampusId: typeof r.data.currentCampusId === 'string' ? r.data.currentCampusId : null,
    });
    window.vibeToast(ONB_COPY.campus.switchDone);
    closePurdue();
    return;
  }
  // Verified, but this page can't see it yet: the new boot carries the new university.
  window.vibeToast(ONB_COPY.campus.switchDone);
  flushDraft();
  location.reload();
}

async function purdueSend() {
  const p = onb.purdue;
  if (p.sending || p.verifying) return;
  const schoolEmail = $('onbPurdueEmail').value.trim();
  if (!PURDUE_EMAIL_RE.test(schoolEmail)) {
    setPurdueMsg(ONB_COPY.campus.switchWrongDomain);
    return;
  }
  setPurdueMsg('');
  if (IS_REPLAY) {
    p.sent = true;
    renderPurdue();
    return;
  }
  setPurdueWorking('sending', true);
  const r = await window.vibeRequest('/api/auth/school-email/request', {
    method: 'POST',
    json: { schoolEmail },
    quiet: true,
    failure: ONB_LOCAL_COPY.sendFailed,
  });
  if (r.ok && r.data.alreadyVerified === true) {
    await rereadCampuses();
    setPurdueWorking('sending', false);
    return;
  }
  setPurdueWorking('sending', false);
  if (!r.ok) {
    // A 429 carries its own line in `error` ("You've asked for 3 emails…").
    setPurdueMsg(r.error || r.message);
    return;
  }
  onb.purdue.sent = true;
  renderPurdue();
}

async function purdueVerify() {
  const p = onb.purdue;
  const code = $('onbPurdueCode').value;
  if (p.sending || p.verifying || code.length !== 8) return;
  setPurdueMsg('');
  if (IS_REPLAY) {
    window.vibeToast(ONB_COPY.campus.switchDone);
    closePurdue();
    renderPurdue();
    return;
  }
  setPurdueWorking('verifying', true);
  const r = await window.vibeRequest('/api/auth/school-email/confirm-code', {
    method: 'POST',
    json: { schoolEmail: $('onbPurdueEmail').value.trim(), code },
    quiet: true,
    failure: ONB_LOCAL_COPY.verifyFailed,
  });
  if (r.ok) await rereadCampuses();
  setPurdueWorking('verifying', false);
  if (!r.ok) setPurdueMsg(r.error || r.message);
}

/** Majors follow the campus: a curated list where one exists, else free text. */
function refreshMajorList() {
  const list = onb.system && onb.campusId && typeof window.vibeMajorsForCampus === 'function'
    ? window.vibeMajorsForCampus(onb.campusId, onb.system)
    : null;

  fillDatalist('iuSchools', list && Array.isArray(list.schools) ? list.schools : []);

    $('pfDepartment').setAttribute('list', 'iuSchools');

    ? ONB_COPY.profile.majorHintList.replace('{label}', () => String(list.label || ''))
    : ONB_COPY.profile.majorHintFree;
}

/** Refill a <datalist> from a list of strings. */
function fillDatalist(id, values) {
  const dl = document.getElementById(id);
  if (!dl) return;
  const frag = document.createDocumentFragment();
  values.forEach(function (v) {
    const opt = document.createElement('option');
    opt.value = v;
    frag.appendChild(opt);
  });
  dl.innerHTML = '';
  dl.appendChild(frag);
}

// The live handle check. The static vibeRequest can't abort, so a sequence
// number retires every earlier check: an answer for "abc" can't land after
// the field already says something about "ab".
let handleSeq = 0;
let handleTimer = null;

function handleStatusColor(status) {
  if (!status) return '#8A8580';
  if (status.kind === 'available') return '#1A9E5B';
  if (status.kind === 'taken' || status.kind === 'reason' || status.kind === 'format') return '#C54323';
  return '#8A8580';
}

function setHandleStatus(status) {
  onb.handleStatus = status;
  ['pfHandleStatus', 'skipHandleStatus'].forEach((id) => {
    const el = $(id);
    el.textContent = status ? status.text : '';
    el.style.color = handleStatusColor(status);
  });
}

/** Normalizes the handle, retires any pending check, sets the status; returns the value to store. */
function checkHandle(raw) {
  const v = String(raw || '').trim().toLowerCase().slice(0, 20);
  const seq = ++handleSeq;
  clearTimeout(handleTimer);
  handleTimer = null;
  const copy = ONB_COPY.profile;
  if (v === '') {
    setHandleStatus(null);
    return v;
  }
  if (!HANDLE_RE.test(v)) {
    setHandleStatus({ kind: 'format', text: copy.handleFormat });
    return v;
  }
  setHandleStatus({ kind: 'checking', text: copy.handleChecking });
  handleTimer = setTimeout(async () => {
    handleTimer = null;
    const r = await window.vibeRequest('/api/handle/check?h=' + encodeURIComponent(v), {
      quiet: true,
      failure: ONB_LOCAL_COPY.handleCheckFailed,
    });
    if (seq !== handleSeq) return;
    // A check that didn't run never reads "taken" (critic D5).
    if (!r.ok) {
      setHandleStatus({ kind: 'unchecked', text: copy.handleUnchecked });
    } else if (r.data.available === true) {
      setHandleStatus({ kind: 'available', text: copy.handleAvailable });
    } else {
      const reason = String(r.data.reason ?? 'taken').toLowerCase();
      setHandleStatus(
        reason === 'taken'
          ? { kind: 'taken', text: copy.handleTaken }
          : { kind: 'reason', text: copy.handleReason.replace('{reason}', () => reason) },
      );
    }
  }, 280);
  return v;
}

/** Name or handle error under step 3's field AND the skip sheet's (one state, two views). */
function setFieldError(field, text) {
  const pairs = field === 'name'
    ? [['pfName', 'pfNameError'], ['skipName', 'skipNameError']]
    : [['pfHandle', 'pfHandleError'], ['skipHandle', 'skipHandleError']];
  pairs.forEach(([inputId, errorId]) => {
    const input = $(inputId);
    const el = $(errorId);
    el.textContent = text || '';
    el.hidden = !text;
    if (text) {
      input.setAttribute('aria-invalid', 'true');
      input.setAttribute('aria-describedby', errorId);
    } else {
      input.removeAttribute('aria-invalid');
      input.removeAttribute('aria-describedby');
    }
  });
}

/** The step-3 client checks; errors go under the fields. Returns the failing field, or null. */
function checkIdentity() {
  const problem = identityProblem(readFields());
  setFieldError('name', problem && problem.field === 'name' ? problem.message : '');
  setFieldError('handle', problem && problem.field === 'handle' ? problem.message : '');
  return problem ? problem.field : null;
}

/** A refusal's line under the name or handle field; returns that field, or null. */
function showProfileFieldError(r) {
  const field = profileFieldForCode(r.code);
  if (field === 'name') {
    setFieldError('name', r.error || ONB_COPY.profile.errors.nameRequired);
  } else if (field === 'handle') {
    setFieldError('handle', r.error || ONB_COPY.profile.errors.handleInvalid);
    if (r.code === 'handle_taken') {
      handleSeq++; // a late live check must not paint over the server's answer
      clearTimeout(handleTimer);
      setHandleStatus({ kind: 'taken', text: ONB_COPY.profile.handleTaken });
    }
  }
  return field;
}

/** A profile refusal that isn't about one field. */
function toastProfileFailure(r) {
  if (r.code === 'profile_invalid') window.vibeToast(r.error || r.message, { tone: 'error' });
  else toastFailure(r);
}

function onProfileInput(key) {
  onb.profileDirty = true;
  if (key === 'name') {
    setFieldError('name', '');
    $('skipName').value = $('pfName').value;
    renderPhoto();
  }
  scheduleDraft();
}

function onHandleInput(raw) {
  const v = checkHandle(raw);
  $('pfHandle').value = v;
  $('skipHandle').value = v;
  onb.profileDirty = true;
  setFieldError('handle', '');
  scheduleDraft();
}

async function continueProfile() {
  if (isBusy()) return;
  const bad = checkIdentity();
  if (bad) {
    // Focusing answers the tap; it isn't focus on step entry.
    $(bad === 'name' ? 'pfName' : 'pfHandle').focus();
    return;
  }
  if (IS_REPLAY) {
    goForward(4);
    return;
  }
  setBusy('savingProfile', true);
  const r = await postProfile();
  setBusy('savingProfile', false);
  if (r.ok) {
    onb.identitySaved = true;
    onb.profileDirty = false;
    goForward(4);
    return;
  }
  const field = showProfileFieldError(r);
  if (field) {
    $(field === 'name' ? 'pfName' : 'pfHandle').focus();
    return;
  }
  toastProfileFailure(r);
}

// ── Step 4: photo ─────────────────────────────────────────────────────────
// Pick, crop to a circle, and it saves right away (upload, then
// users.avatar_url), so the step can't be left with a half-saved photo.

let photoError = null;

function setPhotoError(text) {
  photoError = text || null;
  const el = $('onbPhotoError');
  el.textContent = photoError || '';
  el.hidden = !photoError;
}

function renderPhoto() {
  const circle = $('onbPhotoCircle');
  const src = onb.avatarUrl;
  const img = circle.querySelector('img');
  if (src) {
    if (!img || img.getAttribute('src') !== src) {
      circle.textContent = '';
      const next = document.createElement('img');
      next.alt = '';
      next.src = src;
      circle.appendChild(next);
    }
  } else {
    const initial = ($('pfName').value.trim().charAt(0) || '?').toUpperCase();
    let span = circle.querySelector('.photo-initial');
    if (!span) {
      circle.textContent = '';
      span = document.createElement('span');
      span.className = 'photo-initial';
      span.setAttribute('aria-hidden', 'true');
      circle.appendChild(span);
    }
    span.textContent = initial;
  }

  const busy = isBusy();
  const primary = $('onbPhotoPrimary');
  const secondary = $('onbPhotoSecondary');
  if (onb.uploading) {
    primary.textContent = ONB_COPY.photo.uploading;
    primary.disabled = true;
    secondary.hidden = true;
  } else {
    primary.textContent = src ? ONB_COPY.photo.continue : ONB_COPY.photo.choose;
    primary.disabled = busy;
    secondary.hidden = false;
    secondary.textContent = src ? ONB_COPY.photo.change : ONB_COPY.photo.skip;
    secondary.disabled = busy;
  }
}

function openPhotoPicker() {
  if (isBusy()) return;
  $('onbPhotoInput').click();
}

function onPhotoSaved(url) {
  const prev = onb.blobUrl;
  if (prev && prev !== url) URL.revokeObjectURL(prev);
  const isBlob = url.startsWith('blob:');
  onb.blobUrl = isBlob ? url : null;
  onb.avatarUrl = isBlob ? url : safeImgSrc(url);
  setPhotoError(null);
  renderPhoto();
}

/** The upload route's refusal → the student's line (avatar-upload.ts avatarFailureMessage). */
function avatarRefusal(stage, r) {
  if (r.status === 401 || r.status === 429 || (r.status === 403 && r.code === 'terms_required')) {
    return { ok: false, message: r.message, action: r.action };
  }
  if (stage === 'upload') {
    if (r.status === 413) return { ok: false, message: PHOTO_ERROR_COPY.tooBig };
    if (r.status === 400 && r.error === 'Invalid file size') return { ok: false, message: PHOTO_ERROR_COPY.tooBig };
    if (r.status === 400 && r.error === 'Unsupported file type') return { ok: false, message: PHOTO_ERROR_COPY.wrongType };
  }
  return { ok: false, message: PHOTO_ERROR_COPY.uploadFailed };
}

/** uploadAvatar (avatar-upload.ts), through the static vibeRequest. */
async function uploadAvatarStatic(blob) {
  const pre = preflightAvatarBlob(blob);
  if (!pre.ok) return { ok: false, message: pre.message };
  // Re-typed so the part carries the normalized type (an untyped blob would be refused).
  const typed = blob.type === pre.contentType ? blob : new Blob([blob], { type: pre.contentType });
  const fd = new FormData();
  fd.set('file', typed, 'avatar.' + (AVATAR_EXT_FOR_TYPE[pre.contentType] || 'jpg'));
  fd.set('kind', 'avatar');
  const up = await window.vibeRequest('/api/me/profile-upload', {
    method: 'POST',
    body: fd,
    quiet: true,
    failure: PHOTO_ERROR_COPY.uploadFailed,
  });
  if (!up.ok) return avatarRefusal('upload', up);
  const url = typeof up.data.url === 'string' ? up.data.url.trim() : '';
  if (!url) return { ok: false, message: PHOTO_ERROR_COPY.uploadFailed };

  const saved = await window.vibeRequest('/api/me/profile', {
    method: 'PATCH',
    json: { avatar_url: url },
    quiet: true,
    failure: PHOTO_ERROR_COPY.uploadFailed,
  });
  if (!saved.ok) return avatarRefusal('save', saved);
  // The route echoes the stored row; a different avatar means the write didn't land.
  const profile = saved.data.profile;
  if (profile !== null && typeof profile === 'object' && !Array.isArray(profile) && profile.avatar_url !== url) {
    return { ok: false, message: PHOTO_ERROR_COPY.uploadFailed };
  }
  return { ok: true, url };
}

async function onPhotoPicked(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  // Any image the browser can decode reaches the cropper (HEIC included); the
  // cropper's JPEG output is what gets checked and sent.
  if (file.type && !file.type.startsWith('image/')) {
    setPhotoError(PHOTO_ERROR_COPY.wrongType);
    return;
  }
  setPhotoError(null);
  if (typeof window.openImageCropper !== 'function') {
    setPhotoError(PHOTO_ERROR_COPY.processFailed);
    return;
  }
  const blob = await window.openImageCropper(file, {
    aspect: 1,
    shape: 'circle',
    outputMaxSize: 768,
    outputQuality: 0.92,
    dismissOnBackdrop: false,
    onError: (m) => setPhotoError(m),
  });
  if (!blob) return;
  if (IS_REPLAY) {
    onPhotoSaved(URL.createObjectURL(blob));
    return;
  }
  setBusy('uploading', true);
  const r = await uploadAvatarStatic(blob);
  setBusy('uploading', false);
  if (r.ok) {
    onPhotoSaved(r.url);
    return;
  }
  setPhotoError(r.message);
  if (r.action) window.vibeToast(r.message, { tone: 'error', action: r.action });
}

// ── Step 5: follow clubs ──────────────────────────────────────────────────
// The student's campus clubs from discover, Follow first. Which buttons a row
// shows and every word on them come from orgRowViewOnboarding / ORG_COPY, the
// same table as every other club surface. Club controls wait for the server
// ('…', aria-busy); nothing flips optimistically. Replay sends nothing.

const CLUBS_SEARCH_THRESHOLD = 8;
let clubsSeq = 0;
let peopleSeq = 0;
const clubRowEls = {};
/** Each row's lasting parts, so a tap repaints the row instead of rebuilding it. */
const clubRowParts = new WeakMap();
/** What a club control does right now; its one click listener reads this at click time. */
const clubControlAction = new WeakMap();

/** A new saved campus or university: both lists load again, and any late answer is dropped. */
function resetSocial() {
  clubsSeq++;
  peopleSeq++;
  onb.clubs = freshClubs();
  onb.people = freshPeople();
  Object.keys(clubRowEls).forEach((id) => { delete clubRowEls[id]; });
  $('onbClubsList').textContent = '';
  $('onbClubsSearch').value = '';
  $('onbPeopleList').textContent = '';
  renderClubs();
  renderPeople();
  if (onb.step === 5) loadClubs();
  if (onb.step === 6) loadPeople();
}

function loadClubs() {
  if (onb.clubs.status !== 'idle') return;
  const seq = ++clubsSeq;
  onb.clubs.status = 'loading';
  onb.clubs.failure = null;
  renderClubs();
  // Never with a search term: discover's search widens to the whole university.
  window.vibeRequest('/api/orgs?filter=discover', {
    quiet: true,
    failure: ONB_COPY.clubs.loadFailed,
  }).then((r) => {
    const c = onb.clubs;
    if (seq !== clubsSeq || c.status !== 'loading') return;
    // A 2xx without the list is a failed read, never "no clubs here yet".
    if (r.ok && Array.isArray(r.data.orgs)) {
      c.status = 'ready';
      c.rows = orderClubRows(parseClubRows(r.data.orgs));
    } else {
      c.status = 'failed';
      c.failure = window.vibeLoadFailure(r, ONB_COPY.clubs.loadFailed);
    }
    renderClubs();
  });
}

function retryClubs() {
  onb.clubs.status = 'idle';
  onb.clubs.failure = null;
  loadClubs();
}

function clubRelation(row) {
  const c = onb.clubs;
  const rel = relationFor(row, c.local[row.id]);
  if (c.audience[row.id]) rel.audience = c.audience[row.id];
  return rel;
}

function renderClubsFooter() {
  const c = onb.clubs;
  $('onbClubsContinue').textContent = anyClubFollowed(c.rows, c.local)
    ? ONB_COPY.clubs.continue
    : ONB_COPY.clubs.skipForNow;
}

function skeletonRow() {
  const row = document.createElement('div');
  row.className = 'pick-row skel-row';
  row.setAttribute('aria-hidden', 'true');
  const top = document.createElement('div');
  top.className = 'pick-top';
  const logo = document.createElement('span');
  logo.className = 'pick-logo';
  const text = document.createElement('div');
  text.className = 'pick-text';
  const a = document.createElement('span');
  a.className = 'skel';
  a.style.cssText = 'width:55%;height:14px';
  const b = document.createElement('span');
  b.className = 'skel';
  b.style.cssText = 'width:35%;height:11px;margin-top:8px';
  text.appendChild(a);
  text.appendChild(b);
  const btn = document.createElement('span');
  btn.className = 'skel';
  btn.style.cssText = 'width:84px;height:44px;border-radius:999px;flex-shrink:0';
  top.appendChild(logo);
  top.appendChild(text);
  top.appendChild(btn);
  row.appendChild(top);
  return row;
}

function renderClubs() {
  const c = onb.clubs;
  const list = $('onbClubsList');
  const empty = $('onbClubsEmpty');
  const sparse = $('onbClubsSparse');
  const search = $('onbClubsSearch');
  empty.hidden = true;
  sparse.hidden = true;
  search.hidden = true;
  renderClubsFooter();

  if (c.status === 'failed') {
    list.textContent = '';
    window.vibeLoadFailed(list, c.failure || { message: ONB_COPY.clubs.loadFailed }, retryClubs, { tone: 'dark' });
    return;
  }
  if (c.status !== 'ready') {
    list.textContent = '';
    for (let i = 0; i < 3; i++) list.appendChild(skeletonRow());
    return;
  }
  if (c.rows.length === 0) {
    list.textContent = '';
    empty.hidden = false;
    $('onbClubsEmptyBody').textContent = fillCampus(ONB_COPY.clubs.emptyBody, campusShortName(), ONB_COPY.clubs.emptyBodyNoCampus);
    return;
  }
  if (listState(c.rows.length) === 'sparse') {
    sparse.hidden = false;
    sparse.textContent = fillCampus(ONB_COPY.clubs.sparse, campusShortName(), ONB_COPY.clubs.sparseNoCampus);
  }
  search.hidden = c.rows.length <= CLUBS_SEARCH_THRESHOLD;
  // Rows are built once per load and repainted in place after each tap.
  if (!c.rows.every((row) => clubRowEls[row.id] && clubRowEls[row.id].parentNode === list)) {
    list.textContent = '';
    c.rows.forEach((row) => {
      const el = document.createElement('div');
      el.className = 'pick-row';
      el.setAttribute('role', 'listitem');
      clubRowEls[row.id] = el;
      list.appendChild(el);
    });
  }
  c.rows.forEach(renderClubRow);
  filterClubs();
  bindCursorHover();
}

function filterClubs() {
  const c = onb.clubs;
  const searchable = c.rows.length > CLUBS_SEARCH_THRESHOLD;
  const needle = searchable ? $('onbClubsSearch').value.trim().toLowerCase().replace(/^@/, '') : '';
  c.rows.forEach((row) => {
    const el = clubRowEls[row.id];
    if (!el) return;
    el.hidden = !!needle && !row.name.toLowerCase().includes(needle) && !row.handle.toLowerCase().includes(needle);
  });
}

/** 40 px round logo or avatar; the first letter when there's no safe image or it fails to load. */
function roundImage(className, url, label) {
  const box = document.createElement('div');
  box.className = className;
  box.setAttribute('aria-hidden', 'true');
  const initial = String(label || '').replace(/^@/, '').trim().charAt(0).toUpperCase() || '?';
  const src = safeImgSrc(url);
  if (src) {
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', () => { box.textContent = initial; });
    img.src = src;
    box.appendChild(img);
  } else {
    box.textContent = initial;
  }
  return box;
}

function createClubControl(a) {
  const node = document.createElement(a.href ? 'a' : 'button');
  if (a.href) {
    node.addEventListener('click', (e) => {
      e.preventDefault();
      const s = clubControlAction.get(node);
      if (s) window.__vibeTopNav(s.a.href);
    });
  } else {
    node.type = 'button';
    node.addEventListener('click', () => {
      const s = clubControlAction.get(node);
      if (s) void pressClub(s.row, s.a, s.i);
    });
  }
  return node;
}

function paintClubControl(node, a, busy, locked) {
  if (a.href) {
    node.className = 'pick-btn ' + a.tone;
    node.href = a.href;
    node.textContent = a.label;
    return;
  }
  node.className = 'pick-btn ' + a.tone + (!a.disabled && locked && !busy ? ' locked' : '');
  node.textContent = busy ? ORG_COPY.buttons.busy : a.label;
  node.disabled = a.disabled || locked;
  if (busy) {
    node.setAttribute('aria-busy', 'true');
    node.setAttribute('aria-label', a.label);
  } else {
    node.removeAttribute('aria-busy');
    node.removeAttribute('aria-label');
  }
  if (a.kind === 'follow' || a.kind === 'unfollow') node.setAttribute('aria-pressed', a.kind === 'unfollow' ? 'true' : 'false');
  else node.removeAttribute('aria-pressed');
}

/**
 * One club row. The text column is rebuilt; the controls are repainted in
 * place, index by index, like OrgJoinControl's keyed buttons on the phone, so
 * the button that was tapped keeps keyboard focus and the pointer's hover.
 * Only a control whose element type changes, or a surplus one, is replaced.
 */
function renderClubRow(row) {
  const el = clubRowEls[row.id];
  if (!el) return;
  const c = onb.clubs;
  const rel = clubRelation(row);
  const view = orgRowViewOnboarding(rel);
  const sub = view.sub ?? (rel.state === 'invited' && row.pending_invite
    ? inviteSubText(firstName(row.pending_invite.invited_by_name), row.pending_invite.expires_at)
    : null);

  const logoKey = String(row.logo_url) + '\n' + row.name;
  let parts = clubRowParts.get(el);
  if (!parts || parts.logoKey !== logoKey) {
    el.textContent = '';
    const top = document.createElement('div');
    top.className = 'pick-top';
    top.appendChild(roundImage('pick-logo', row.logo_url, row.name));
    const text = document.createElement('div');
    text.className = 'pick-text';
    top.appendChild(text);
    el.appendChild(top);
    parts = { logoKey, top, text, actions: document.createElement('div') };
    clubRowParts.set(el, parts);
  }
  const { top, text, actions } = parts;

  text.textContent = '';
  const nameLine = document.createElement('div');
  nameLine.className = 'pick-name-line';
  const name = document.createElement('span');
  name.className = 'pick-name';
  name.textContent = row.name;
  nameLine.appendChild(name);
  if (row.verified) {
    const check = document.createElement('span');
    check.className = 'pick-verified';
    check.setAttribute('aria-label', ONB_LOCAL_COPY.verified);
    check.title = ONB_LOCAL_COPY.verified;
    check.textContent = '✓';
    nameLine.appendChild(check);
  }
  if (view.chip) {
    const chip = document.createElement('span');
    chip.className = 'pick-chip';
    chip.textContent = view.chip;
    nameLine.appendChild(chip);
  }
  text.appendChild(nameLine);
  const meta = document.createElement('div');
  meta.className = 'pick-meta';
  meta.textContent = ['@' + row.handle].concat(view.meta).join(' · ');
  text.appendChild(meta);
  if (sub) {
    const subEl = document.createElement('div');
    subEl.className = 'pick-sub invite';
    subEl.textContent = sub;
    text.appendChild(subEl);
  }
  if (view.disclosure) {
    const disc = document.createElement('p');
    disc.className = 'pick-sub';
    disc.textContent = view.disclosure;
    text.appendChild(disc);
  }

  actions.className = 'pick-actions ' + view.layout;
  const home = view.layout === 'line' ? el : top;
  if (actions.parentNode !== home) home.appendChild(actions);
  const busyIndex = c.busy[row.id];
  const locked = busyIndex !== undefined || !!c.disabled[row.id];
  const old = Array.from(actions.children);
  const wanted = view.actions;
  let keep = 0;
  while (keep < old.length && keep < wanted.length && old[keep].tagName === (wanted[keep].href ? 'A' : 'BUTTON')) keep++;
  old.slice(keep).forEach((node) => node.remove());
  wanted.forEach((a, i) => {
    let node = old[i];
    if (i >= keep) {
      node = createClubControl(a);
      actions.appendChild(node);
    }
    clubControlAction.set(node, { row, a, i });
    paintClubControl(node, a, busyIndex === i, locked);
  });
  if (keep < old.length || keep < wanted.length) bindCursorHover();
}

/** A tap's answer: kept for this row until the list reloads. */
function applyClub(row, next, audience) {
  const c = onb.clubs;
  c.local[row.id] = { state: next.state, following: next.following, role: next.role };
  if (audience) c.audience[row.id] = audience;
  renderClubRow(row);
  renderClubsFooter();
}

function setClubBusy(row, index) {
  const c = onb.clubs;
  if (index === null) delete c.busy[row.id];
  else c.busy[row.id] = index;
  renderClubRow(row);
}

/** OrgJoinControl's refuse(): 429, a gone club, a club code, else the mapped line with its action. */
function refuseClub(row, r) {
  if (r.status === 429) {
    window.vibeToast(ORG_COPY.errors.tooMany, { tone: 'error' });
    return;
  }
  if (r.code === 'not_found') {
    window.vibeToast(ORG_COPY.errors.notFound, { tone: 'error' });
    onb.clubs.disabled[row.id] = true;
    renderClubRow(row);
    return;
  }
  const known = orgErrorCopy(r.code);
  window.vibeToast(known ?? r.message, { tone: 'error', action: known ? undefined : r.action });
}

/** One club control tap (OrgJoinControl.tsx press(), variant "onboarding"). */
async function pressClub(row, a, index) {
  const c = onb.clubs;
  if (c.busy[row.id] !== undefined || c.disabled[row.id] || a.disabled) return;
  const rel = clubRelation(row);
  const next = changeAfter(rel, a.kind);
  if (!next) return;
  if (IS_REPLAY) {
    applyClub(row, next);
    return;
  }
  // Onboarding never offers Decline (it needs the invite sheet's confirm).
  if (a.kind === 'decline') return;

  const handle = encodeURIComponent(rel.handle);
  const orgName = rel.orgName.trim() || 'this org';
  // A reset (new campus) while this was out makes the answer stale.
  const stale = () => onb.clubs !== c;

  if (a.kind === 'follow' || a.kind === 'unfollow') {
    const following = a.kind === 'follow';
    setClubBusy(row, index);
    const r = await window.vibeRequest('/api/orgs/' + handle + '/follow', following
      ? { method: 'POST', json: { source: 'onboarding' }, quiet: true, failure: ORG_COPY.control.followFailed }
      : { method: 'DELETE', quiet: true, failure: ORG_COPY.control.unfollowFailed });
    if (stale()) return;
    setClubBusy(row, null);
    if (r.ok) {
      applyClub(row, next);
    } else if (!following && r.code === 'member_follows') {
      // They joined somewhere else since this rendered. Members follow.
      window.vibeToast(ORG_COPY.errors.memberFollows);
      applyClub(row, { state: 'member', following: true, role: rel.role ?? 'member' });
    } else {
      refuseClub(row, r);
    }
    return;
  }

  // join, request and accept all go through the one door (join/route.ts).
  const failure = a.kind === 'accept'
    ? ORG_COPY.control.acceptFailed
    : a.kind === 'request'
      ? ORG_COPY.control.requestFailed
      : ORG_COPY.control.joinFailed;
  setClubBusy(row, index);
  const r = await window.vibeRequest('/api/orgs/' + handle + '/join', {
    method: 'POST',
    json: {},
    quiet: true,
    failure,
  });
  if (stale()) return;
  setClubBusy(row, null);
  if (r.ok) {
    if (r.data.joined === true) {
      applyClub(row, { state: 'member', following: true, role: isOrgRole(r.data.role) ? r.data.role : 'member' });
      if (a.kind === 'accept') window.vibeToast(fillCopy(ORG_COPY.control.welcome, { org: orgName }));
    } else if (r.data.pending === true) {
      applyClub(row, { state: 'requested', following: rel.following, role: rel.role });
    } else {
      // A 2xx that says neither: nothing is known to have changed.
      window.vibeToast(failure + ' Try again.', { tone: 'error' });
    }
    return;
  }
  switch (r.code) {
    case 'invite_only':
      applyClub(row, { state: 'invite_only', following: rel.following, role: rel.role });
      return;
    case 'audience_mismatch':
      applyClub(
        row,
        { state: 'audience_blocked', following: rel.following, role: rel.role },
        audienceFromRefusal(r.error, rel.audience),
      );
      return;
    case 'school_unverified':
      applyClub(row, { state: 'unverified', following: rel.following, role: rel.role });
      return;
    default:
      refuseClub(row, r);
  }
}

// ── Step 6: follow people ─────────────────────────────────────────────────
// Suggestions grouped by the server's reason. Person follows are optimistic
// (unlike club controls): the button flips at once, and a refusal rolls it
// back. A 403 that isn't the Terms gate is a block in either direction, so
// that row just disappears, with no toast. Replay flips locally only.

function renderPeopleOtto() {
  const copy = ONB_COPY.people;
  const name = campusShortName();
  const row = campusRowById(campusForSteps());
  const shared = (row ? row.systems.length : 0) > 1;
  $('onbPeopleOtto').textContent = name === null
    ? copy.ottoNoCampus
    : fillCampus(shared ? copy.ottoShared : copy.ottoSingle, name, copy.ottoNoCampus);
}

function loadPeople() {
  if (onb.people.status !== 'idle') return;
  const seq = ++peopleSeq;
  onb.people.status = 'loading';
  onb.people.failure = null;
  renderPeople();
  window.vibeRequest('/api/me/suggested-connections?limit=25', {
    quiet: true,
    failure: ONB_COPY.people.loadFailed,
  }).then((r) => {
    const p = onb.people;
    if (seq !== peopleSeq || p.status !== 'loading') return;
    // A 2xx without the list is a failed read, never "no one to follow yet".
    if (r.ok && Array.isArray(r.data.suggestions)) {
      p.status = 'ready';
      p.list = parseSuggestions(r.data.suggestions);
    } else {
      p.status = 'failed';
      p.failure = window.vibeLoadFailure(r, ONB_COPY.people.loadFailed);
    }
    renderPeople();
  });
}

function retryPeople() {
  onb.people.status = 'idle';
  onb.people.failure = null;
  loadPeople();
}

function renderPeople() {
  const p = onb.people;
  const copy = ONB_COPY.people;
  const list = $('onbPeopleList');
  const top = $('onbPeopleTop');
  const empty = $('onbPeopleEmpty');
  top.hidden = true;
  empty.hidden = true;
  list.textContent = '';
  renderPeopleOtto();

  if (p.status === 'failed') {
    window.vibeLoadFailed(list, p.failure || { message: copy.loadFailed }, retryPeople, { tone: 'dark' });
    return;
  }
  if (p.status !== 'ready') {
    for (let i = 0; i < 3; i++) list.appendChild(skeletonRow());
    return;
  }
  const visible = p.list.filter((person) => !p.removed[person.id]);
  const shape = listState(visible.length);
  if (shape === 'empty') {
    empty.hidden = false;
    $('onbPeopleEmptyBody').textContent = fillCampus(copy.emptyBody, campusShortName(), copy.emptyBodyNoCampus);
    bindCursorHover();
    return;
  }
  if (shape === 'sparse') top.hidden = false;

  groupPeople(visible, { system: onb.system, campusShortName: campusShortName() }).forEach((group) => {
    const wrap = document.createElement('div');
    wrap.className = 'people-group';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', group.label);
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = group.label;
    wrap.appendChild(label);
    const rows = document.createElement('div');
    rows.className = 'pick-list';
    group.people.forEach((person) => rows.appendChild(personRow(person)));
    wrap.appendChild(rows);
    list.appendChild(wrap);
  });
  bindCursorHover();
}

function personRow(person) {
  const handle = person.handle ? '@' + person.handle : null;
  const title = person.name ?? handle ?? '';
  const row = document.createElement('div');
  row.className = 'pick-row';
  const top = document.createElement('div');
  top.className = 'pick-top';
  top.appendChild(roundImage('pick-logo', person.avatar_url, title));
  const text = document.createElement('div');
  text.className = 'pick-text';
  const name = document.createElement('span');
  name.className = 'pick-name';
  name.textContent = title;
  text.appendChild(name);
  const metaText = [handle, person.major].filter(Boolean).join(' · ');
  if (metaText) {
    const meta = document.createElement('span');
    meta.className = 'pick-meta';
    meta.textContent = metaText;
    text.appendChild(meta);
  }
  top.appendChild(text);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.dataset.personId = person.id;
  btn.addEventListener('click', () => { void togglePerson(person); });
  paintPersonButton(btn, person.id);
  const actions = document.createElement('div');
  actions.className = 'pick-actions slot';
  actions.appendChild(btn);
  top.appendChild(actions);
  row.appendChild(top);
  return row;
}

function paintPersonButton(btn, id) {
  const p = onb.people;
  const following = p.followed[id] === true;
  btn.className = 'pick-btn ' + (following ? 'quiet' : 'filled');
  btn.textContent = following ? ONB_COPY.people.following : ONB_COPY.people.follow;
  btn.setAttribute('aria-pressed', following ? 'true' : 'false');
  if (p.busy[id]) btn.setAttribute('aria-busy', 'true');
  else btn.removeAttribute('aria-busy');
}

function repaintPerson(id) {
  document.querySelectorAll('#onbPeopleList button[data-person-id]').forEach((btn) => {
    if (btn.dataset.personId === id) paintPersonButton(btn, id);
  });
}

async function togglePerson(person) {
  const p = onb.people;
  const id = person.id;
  if (p.busy[id]) return;
  const was = p.followed[id] === true;
  p.followed[id] = !was;
  if (!IS_REPLAY) p.busy[id] = true;
  repaintPerson(id);
  if (IS_REPLAY) return;

  const r = await window.vibeRequest('/api/me/follow', {
    method: was ? 'DELETE' : 'POST',
    json: { target_id: id },
    quiet: true,
    failure: was ? ONB_COPY.people.unfollowFailed : ONB_COPY.people.followFailed,
  });
  if (onb.people !== p) return;
  delete p.busy[id];
  if (r.ok) {
    repaintPerson(id);
    return;
  }
  p.followed[id] = was;
  // A 403 that isn't the Terms gate is a block, in either direction.
  if (r.status === 403 && r.code !== 'terms_required') {
    p.removed[id] = true;
    renderPeople();
    return;
  }
  repaintPerson(id);
  toastFailure(r);
}

async function shareVibe() {
  const url = location.origin;
  if (typeof navigator.share === 'function') {
    try {
      await navigator.share({ title: 'Vibe', url });
      return;
    } catch (err) {
      // The student closed the share sheet: nothing to say.
      if (err && err.name === 'AbortError') return;
    }
  }
  await window.vibeCopy(url, ONB_COPY.people.copied);
}

// ── Finish and Skip ───────────────────────────────────────────────────────

/** Onboarding is done: drop the draft, queue the campus tour, land where the server says. */
function succeed(next, ottoConfig) {
  clearDraftNow();
  try { localStorage.setItem('vibe_tour_pending', 'campus'); } catch (e) { /* the campus page still starts the tour from its URL */ }
  // _otto.js and profile.html read these caches; desktop only.
  vibeSave('vibe_otto_v1', ottoConfig);
  vibeSave('vibe_user_v1', { name: $('pfName').value.trim(), tagline: '', headline: '', location: '', vibeTags: [], _onboarded: true });
  // Used verbatim: the server's path already carries the welcome flag.
  const dest = typeof next === 'string' && isSafeRelativePath(next) ? next : '/campus?welcome=1';
  triggerHyperdrive(function () { window.__vibeTopNav(dest); });
}

async function finish() {
  if (isBusy()) return;
  if (IS_REPLAY) {
    $('onbFinish').disabled = true;
    triggerHyperdrive(function () { window.__vibeTopNav('/campus'); });
    return;
  }
  setBusy('finishing', true);
  const stop = () => setBusy('finishing', false);

  // Catch up a campus pick that never went through Continue (browser
  // Forward, for one), so Finish can't succeed on the old campus.
  if (onb.system !== null && onb.campusId !== onb.savedCampusId) {
    if (!onb.campusId || !campusAllowed(onb.campusId, onb.system)) {
      stop();
      setCampusError(onb.campusId ? ONB_COPY.campus.invalid : ONB_COPY.campus.required);
      sendBack(2);
      return;
    }
    const picked = onb.campusId;
    const rc = await postCampus(picked);
    if (!rc.ok) {
      stop();
      if (CAMPUS_FIELD_CODES.includes(rc.code)) {
        setCampusError(rc.error || ONB_COPY.campus.invalid);
        sendBack(2);
      } else {
        toastFailure(rc);
      }
      return;
    }
    markCampusSaved(picked);
  }

  // The same for profile edits that were never saved.
  if (onb.profileDirty || !onb.identitySaved) {
    if (checkIdentity()) {
      stop();
      sendBack(3);
      return;
    }
    const rp = await postProfile();
    if (!rp.ok) {
      stop();
      if (showProfileFieldError(rp)) sendBack(3);
      else toastProfileFailure(rp);
      return;
    }
    onb.identitySaved = true;
    onb.profileDirty = false;
  }

  // No university on record means no campus can ever be allowed, so that
  // student finishes the way Skip does instead of meeting a Finish that can
  // never work (critic L8).
  const ottoConfig = buildOttoConfig();
  const r = await window.vibeRequest('/api/me/onboarding-complete', {
    method: 'POST',
    json: Object.assign({ v: 2, otto_answers: ottoConfig }, onb.system === null ? { skip: true } : {}),
    quiet: true,
    failure: ONB_COPY.people.finishFailed,
  });
  if (r.ok) {
    succeed(r.data.next, ottoConfig);
    return;
  }
  stop();
  if (r.code === 'name_required') {
    setFieldError('name', r.error || ONB_COPY.profile.errors.nameRequired);
    sendBack(3);
    return;
  }
  if (r.code === 'handle_required') {
    setFieldError('handle', r.error || ONB_COPY.profile.errors.handleRequired);
    sendBack(3);
    return;
  }
  if (r.code === 'campus_required' || r.code === 'campus_invalid') {
    if (onb.system !== null) {
      setCampusError(r.error || ONB_COPY.campus.required);
      sendBack(2);
    } else {
      window.vibeToast(r.error || r.message, { tone: 'error' });
    }
    return;
  }
  // terms_required keeps Review Terms; a 429 shows the mapped line.
  toastFailure(r);
}

// The skip sheet. `saved`: a name and handle are already saved, so skipping
// keeps everything. `identity`: nobody can find a student without them, so
// the sheet asks for both first (bound to step 3's inputs).

function skipVariant() {
  return onb.forceIdentity ? 'identity' : onb.skipBase;
}

let skipShownVariant = null;

function renderSkip() {
  const overlay = $('skipOverlay');
  overlay.classList.toggle('open', onb.skipOpen);
  $('onbSkip').disabled = isBusy() || onb.skipOpen;
  if (!onb.skipOpen) {
    skipShownVariant = null;
    return;
  }
  const busy = isBusy();
  const variant = skipVariant();
  const copy = ONB_COPY.skip;
  const primary = $('skipPrimary');
  const secondary = $('skipSecondary');
  $('skipIdentity').hidden = variant !== 'identity';
  if (variant === 'saved') {
    $('skipBody').textContent = copy.bodySaved;
    primary.textContent = copy.keepGoing;
    secondary.textContent = busy ? copy.skipping : copy.skipAnyway;
  } else {
    $('skipBody').textContent = copy.bodyIdentity;
    primary.textContent = busy ? copy.saving : copy.saveAndSkip;
    secondary.textContent = copy.keepGoing;
  }
  primary.disabled = busy;
  secondary.disabled = busy;
  $('skipName').disabled = busy;
  $('skipHandle').disabled = busy;
  // On open (and when a refused save switches the variant), focus the primary
  // button, never an input.
  if (skipShownVariant !== variant) {
    skipShownVariant = variant;
    primary.focus();
  }
  bindCursorHover();
}

function openSkip() {
  if (isBusy() || onb.skipOpen) return;
  // In replay nothing is saved, so what's typed decides the variant.
  const f = readFields();
  const hasIdentity = IS_REPLAY ? !!f.name.trim() && HANDLE_RE.test(f.handle) : onb.identitySaved;
  onb.skipBase = hasIdentity ? 'saved' : 'identity';
  onb.forceIdentity = false;
  $('skipName').value = f.name;
  $('skipHandle').value = f.handle;
  onb.skipOpen = true;
  renderSkip();
}

function closeSkip() {
  if (!onb.skipOpen) return;
  onb.skipOpen = false;
  onb.forceIdentity = false;
  renderSkip();
  $('onbSkip').focus();
}

function onSkipPrimary() {
  if (skipVariant() === 'saved') closeSkip();
  else void runSkip();
}
function onSkipSecondary() {
  if (skipVariant() === 'saved') void runSkip();
  else closeSkip();
}

/** Skip anyway / Save & skip. */
async function runSkip() {
  if (isBusy()) return;
  const variant = skipVariant();
  if (IS_REPLAY) {
    if (variant === 'identity' && checkIdentity()) return;
    window.__vibeTopNav('/campus');
    return;
  }
  setBusy('skipping', true);
  const stop = () => setBusy('skipping', false);

  // A campus is optional on skip, so a refused save is ignored. Only a pick
  // the student could have seen is sent: never the preselect from step 1.
  if (onb.maxStep >= 2 && campusAllowed(onb.campusId, onb.system) && onb.campusId !== onb.savedCampusId) {
    const picked = onb.campusId;
    const rc = await postCampus(picked);
    if (rc.ok) markCampusSaved(picked);
  }

  if (variant === 'identity' || onb.profileDirty) {
    if (checkIdentity()) {
      onb.forceIdentity = true;
      stop();
      return;
    }
    const rp = await postProfile();
    if (!rp.ok) {
      if (showProfileFieldError(rp)) onb.forceIdentity = true;
      else toastProfileFailure(rp);
      stop();
      return;
    }
    onb.identitySaved = true;
    onb.profileDirty = false;
  }

  const ottoConfig = buildOttoConfig();
  const r = await window.vibeRequest('/api/me/onboarding-complete', {
    method: 'POST',
    json: { v: 2, otto_answers: ottoConfig, skip: true },
    quiet: true,
    failure: ONB_COPY.skip.failed,
  });
  if (r.ok) {
    succeed(r.data.next, ottoConfig);
    return;
  }
  if (r.code === 'name_required') {
    onb.forceIdentity = true;
    setFieldError('name', r.error || ONB_COPY.profile.errors.nameRequired);
  } else if (r.code === 'handle_required') {
    onb.forceIdentity = true;
    setFieldError('handle', r.error || ONB_COPY.profile.errors.handleRequired);
  } else {
    toastFailure(r);
  }
  stop();
}

/** Header logo: replay just leaves; a first run asks first (the app would bounce back here). */
function leaveViaLogo() {
  if (isBusy()) return;
  if (IS_REPLAY) window.__vibeTopNav('/campus');
  else openSkip();
}

// ── Wiring ────────────────────────────────────────────────────────────────
function bindEvents() {
  $('onbBack').addEventListener('click', () => { if (!isBusy()) history.back(); });
  $('onbSkip').addEventListener('click', openSkip);
  $('onbLogo').addEventListener('click', (e) => { e.preventDefault(); leaveViaLogo(); });
  window.addEventListener('popstate', onPopState);

  $('onbHelloContinue').addEventListener('click', () => { if (!isBusy()) goForward(2); });
  $('onbCampusContinue').addEventListener('click', () => { void continueCampus(); });
  $('onbProfileContinue').addEventListener('click', () => { void continueProfile(); });
  $('onbClubsContinue').addEventListener('click', () => { if (!isBusy()) goForward(6); });
  $('onbFinish').addEventListener('click', () => { void finish(); });

  $('onbPurdueLink').addEventListener('click', () => {
    if (isBusy()) return;
    onb.purdue.open = true;
    renderPurdue();
  });
  $('onbPurdueSend').addEventListener('click', () => { void purdueSend(); });
  $('onbPurdueVerify').addEventListener('click', () => { void purdueVerify(); });
  $('onbPurdueCancel').addEventListener('click', () => {
    if (onb.purdue.sending || onb.purdue.verifying) return;
    closePurdue();
    renderPurdue();
  });
  $('onbPurdueCode').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8);
    renderPurdue();
  });

  ['pfName', 'pfBio', 'pfMajor', 'pfDepartment', 'pfYear', 'pfInterests', 'pfSkills'].forEach((id) => {
    $(id).addEventListener(id === 'pfYear' ? 'change' : 'input', () => onProfileInput(id === 'pfName' ? 'name' : id));
  });
  $('pfHandle').addEventListener('input', (e) => onHandleInput(e.target.value));
  document.querySelectorAll('.pf-looking').forEach((box) => {
    box.addEventListener('change', () => {
      const without = onb.lookingFor.filter((v) => v !== box.value);
      onb.lookingFor = box.checked ? without.concat(box.value) : without;
      onProfileInput('looking_for');
    });
  });

  $('onbPhotoPrimary').addEventListener('click', () => {
    if (isBusy()) return;
    if (onb.avatarUrl) goForward(5);
    else openPhotoPicker();
  });
  $('onbPhotoSecondary').addEventListener('click', () => {
    if (isBusy()) return;
    if (onb.avatarUrl) openPhotoPicker();
    else goForward(5);
  });
  $('onbPhotoInput').addEventListener('click', (e) => { e.target.value = ''; });
  $('onbPhotoInput').addEventListener('change', (e) => { void onPhotoPicked(e); });

  $('onbClubsSearch').addEventListener('input', filterClubs);
  document.querySelectorAll('.onb-share').forEach((b) => b.addEventListener('click', () => { void shareVibe(); }));

  $('skipPrimary').addEventListener('click', onSkipPrimary);
  $('skipSecondary').addEventListener('click', onSkipSecondary);
  $('skipName').addEventListener('input', (e) => {
    $('pfName').value = e.target.value;
    onProfileInput('name');
  });
  $('skipHandle').addEventListener('input', (e) => onHandleInput(e.target.value));
  $('skipOverlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget && !isBusy()) closeSkip();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && onb.skipOpen && !isBusy()) closeSkip();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushDraft();
  });
  window.addEventListener('pagehide', () => {
    flushDraft();
    if (onb.blobUrl) URL.revokeObjectURL(onb.blobUrl);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────
(function bootOnboarding() {
  applyCopy();
  writeFields(ONB_RESTORE.fields);
  renderCampusCards();
  refreshMajorList();
  renderClubs();
  renderPeople();
  bindEvents();
  renderBusy();
  buildHistoryStack();
  showStep(onb.step);
})();

// ── Hyperdrive: streak the screen out, then call `onDone`. ────────────────
function triggerHyperdrive(onDone) {
  const overlay = document.getElementById('ottWarp');
  if (!overlay) { onDone && onDone(); return; }
  // Build ~24 streaks at evenly-spaced angles with slight jitter so they
  // feel organic rather than a starburst clipart.
  const COUNT = 24;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < COUNT; i++) {
    const jitter = (Math.random() - 0.5) * (Math.PI / COUNT);
    const ang = (i / COUNT) * Math.PI * 2 + jitter;
    const cos = Math.cos(ang).toFixed(4);
    const sin = Math.sin(ang).toFixed(4);
    const el = document.createElement('span');
    el.className = 'ott-warp-streak';
    el.style.setProperty('--ang', ang.toFixed(4) + 'rad');
    el.style.setProperty('--cos', cos);
    el.style.setProperty('--sin', sin);
    frag.appendChild(el);
  }
  overlay.innerHTML = '';
  overlay.appendChild(frag);
  // Force reflow so the animation actually runs when we add `.active`.
  overlay.getBoundingClientRect();
  overlay.classList.add('active');
  document.body.classList.add('ott-warping');
  setTimeout(function () { onDone && onDone(); }, 750);
}
