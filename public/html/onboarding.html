<!DOCTYPE html>
<!-- Otto onboarding (static). Open via /onboarding from the Next app so query params are preserved. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/icon.png" type="image/png" sizes="192x192">
<link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/vibe-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180">
<title>Meet Otto — Vibe</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/html/_persistence.js"></script>
<!-- window.vibeMajorsForCampus: the curated majors list for the campus the
     student picks, generated from src/lib/iu/majors.ts (same include as
     profile.html). -->
<script src="/html/_iu-majors.js"></script>
<!-- window.openImageCropper: the photo step's circle cropper (same include as
     profile.html). Read at tap time, never at load. -->
<script src="/html/_imageCropper.js" defer></script>
<style>
:root { --cream:#FAF7F2; --charcoal:#1C1C1E; --accent:#FF5C35; --purple:#7C5CFC; --lavender:#C8B8FF; --green:#1A9E5B; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--charcoal); color: white;
  cursor: none; overflow-x: hidden; min-height: 100vh;
}

/* Custom cursor (matches the rest of vibe) */
.cursor { width:8px;height:8px;background:var(--accent);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:2147483647;will-change:transform;transition:width .15s,height .15s,background .15s; }
.cursor-ring { width:28px;height:28px;border:1.5px solid var(--accent);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:2147483646;will-change:transform;opacity:.45;transition:width .2s,height .2s,opacity .2s; }
.cursor.hover { width:6px;height:6px;background:white; }
.cursor-ring.hover { width:44px;height:44px;opacity:.4;border-color:white; }
*,*::before,*::after { cursor:none!important; }
input, textarea, [contenteditable="true"] { cursor:text!important; }

/* Frame */
.onb-shell { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; overflow: hidden; }
.onb-bg-1 { position: absolute; top: -200px; right: -200px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(255,92,53,.16) 0%, transparent 70%); pointer-events: none; }
.onb-bg-2 { position: absolute; bottom: -150px; left: 10%; width: 540px; height: 540px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,252,.13) 0%, transparent 70%); pointer-events: none; transition: all .8s ease; }

/* Top bar: pinned full width on every step (Back, logo, Skip). The fade
   keeps a scrolled step readable under it. */
.onb-top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 22px 24px 18px;
  background: linear-gradient(to bottom, rgba(28,28,30,.96) 60%, rgba(28,28,30,0));
  display: grid; grid-template-columns: 44px auto 1fr auto; align-items: center; gap: 8px;
}
.onb-back {
  width: 44px; height: 44px; min-height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif; font-size: 18px; line-height: 1; color: white;
  background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.12);
  transition: background .15s, opacity .15s;
}
.onb-back:hover:not(:disabled) { background: rgba(255,255,255,.12); }
.onb-back:disabled { opacity: .4; }
.onb-logo { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; color: white; letter-spacing: -1px; text-decoration: none; }
.onb-logo span { color: var(--accent); }
.onb-skip {
  justify-self: end; min-height: 44px; min-width: 44px;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
  color: rgba(255,255,255,.55); background: none; border: none;
  padding: 8px 12px; border-radius: 100px; transition: color .15s, opacity .15s;
}
.onb-skip:hover:not(:disabled) { color: white; }
.onb-skip:disabled { opacity: .4; }

.replay-pill {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 11;
  font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase;
  color: #F5C842;
  background: rgba(245, 200, 66, 0.1);
  border: 1px solid rgba(245, 200, 66, 0.3);
  padding: 4px 10px; border-radius: 999px;
  pointer-events: none; white-space: nowrap;
}

/* Progress dots: the fixed centre spot, drawn on top of the bar */
.progress-dots {
  position: fixed; top: 33px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 9px; align-items: center; z-index: 11;
  padding: 8px 16px; background: rgba(0,0,0,.25); border: 0.5px solid rgba(255,255,255,.06);
  border-radius: 100px; backdrop-filter: blur(10px);
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.15); transition: all .35s; }
.dot.done { background: var(--accent); box-shadow: 0 0 6px rgba(255,92,53,.4); }
.dot.now { background: var(--accent); transform: scale(1.5); box-shadow: 0 0 8px var(--accent); }
.progress-text { font-size: 10px; color: rgba(255,255,255,.5); margin-left: 8px; letter-spacing: .3px; font-weight: 500; }

/* Step container */
.onb-step {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; max-width: 600px; width: 100%; position: relative; z-index: 1;
  padding: 96px 20px 48px;
  animation: stepIn .42s cubic-bezier(.2,.8,.2,1);
}
.onb-step.active { display: flex; }
@keyframes stepIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

/* Otto orb sizes */
@keyframes pulse-core { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes pulse-core-big { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.2); opacity: 1; } }
@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes spin-med { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes ring-breathe { 0%,100% { transform: scale(1); opacity: .25; } 50% { transform: scale(1.4); opacity: 0; } }
@keyframes ring-breathe-big { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.5); opacity: 0; } }

.otto-big, .otto-mid, .otto-sm { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.otto-big { width: 180px; height: 180px; margin-bottom: 32px; }
.otto-mid { width: 110px; height: 110px; margin-bottom: 26px; }
.otto-sm  { width: 76px; height: 76px;  margin-bottom: 22px; }

.otto-big .pulse-1 { position: absolute; inset: 40px; border-radius: 50%; border: 1px solid var(--accent); animation: ring-breathe-big 2.8s ease-out infinite; }
.otto-big .pulse-2 { position: absolute; inset: 40px; border-radius: 50%; border: 1px solid var(--purple); animation: ring-breathe-big 3.4s ease-out 1.4s infinite; }
.otto-big .orbit-out { position: absolute; inset: 24px; border-radius: 50%; border: 0.5px solid rgba(255,92,53,.3); animation: spin-slow 8s linear infinite; }
.otto-big .orbit-out .d1 { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.otto-big .orbit-out .d2 { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--purple); }
.otto-big .orbit-mid { position: absolute; inset: 50px; border-radius: 50%; border: 0.5px solid rgba(124,92,252,.4); animation: spin-med 4.5s linear infinite reverse; }
.otto-big .orbit-mid .d { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--lavender); }
.otto-big .core { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 22px var(--accent), 0 0 40px rgba(124,92,252,.5); animation: pulse-core-big 2.4s ease-in-out infinite; }

.otto-mid .pulse-1 { position: absolute; inset: 26px; border-radius: 50%; border: 1px solid var(--accent); animation: ring-breathe 2.8s ease-out infinite; }
.otto-mid .pulse-2 { position: absolute; inset: 26px; border-radius: 50%; border: 1px solid var(--purple); animation: ring-breathe 3.4s ease-out .7s infinite; }
.otto-mid .orbit-out { position: absolute; inset: 14px; border-radius: 50%; border: 0.5px solid rgba(255,92,53,.3); animation: spin-slow 8s linear infinite; }
.otto-mid .orbit-out .d { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.otto-mid .core { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); animation: pulse-core 2.4s ease-in-out infinite; }

.otto-sm .pulse-1 { position: absolute; inset: 18px; border-radius: 50%; border: 1px solid var(--accent); animation: ring-breathe 2.8s ease-out infinite; }
.otto-sm .pulse-2 { position: absolute; inset: 18px; border-radius: 50%; border: 1px solid var(--purple); animation: ring-breathe 3.4s ease-out .7s infinite; }
.otto-sm .orbit-out { position: absolute; inset: 8px; border-radius: 50%; border: 0.5px solid rgba(255,92,53,.3); animation: spin-slow 8s linear infinite; }
.otto-sm .orbit-out .d { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }
.otto-sm .core { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse-core 2.4s ease-in-out infinite; }

/* Type */
.h1 { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 900; color: white; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 18px; }
.h1 em { color: var(--accent); font-style: italic; }
.h2 { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 900; color: white; letter-spacing: -1px; line-height: 1.15; margin-bottom: 12px; }
.intro { font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; line-height: 1.6; color: rgba(255,255,255,.78); max-width: 480px; margin-bottom: 36px; }
.sub-intro { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: rgba(255,255,255,.55); margin-bottom: 28px; max-width: 480px; line-height: 1.55; }

/* CTAs */
.cta-row { display: flex; gap: 10px; align-items: center; }
.btn-coral {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
  padding: 13px 28px; background: var(--accent); color: white;
  border: none; border-radius: 100px; cursor: none;
  box-shadow: 0 6px 20px rgba(255,92,53,.32);
  transition: all .18s; letter-spacing: .2px;
}
.btn-coral:hover { background: #ff7055; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,92,53,.42); }
.btn-coral:disabled { background: rgba(255,92,53,.3); box-shadow: none; cursor: not-allowed; }
.btn-skip-step {
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  padding: 13px 22px; color: rgba(255,255,255,.55); background: none; border: none;
  border-radius: 100px; cursor: none; transition: color .15s;
}
.btn-skip-step:hover { color: white; }
.note { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 22px; letter-spacing: .2px; }
.note.italic { font-style: italic; }

/* Step 3 — profile (the same fields as the Vibe profile) */
.onb-step[data-step="3"] { max-width: 560px; }
.pf-form {
  width: 100%; max-width: 480px; text-align: left;
  display: flex; flex-direction: column; gap: 14px; margin-bottom: 22px;
}
.pf-hint {
  font-size: 11px; color: rgba(255,255,255,.38);
  line-height: 1.45; margin-top: 5px; font-style: italic;
}
.pf-label {
  display: block; margin-bottom: 6px;
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.5);
  letter-spacing: .4px; text-transform: uppercase;
}
/* A field a save or Finish couldn't use. */
.pf-error {
  font-size: 11px; font-weight: 600; color: var(--accent);
  line-height: 1.45; margin-top: 5px;
}
.pf-input, .pf-select, .pf-textarea {
  width: 100%; background: rgba(255,255,255,.07);
  border: 0.5px solid rgba(255,255,255,.12); border-radius: 12px;
  padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px;
  color: white; outline: none; transition: border-color .15s;
}
.pf-input { min-height: 44px; }
.pf-input:focus, .pf-select:focus, .pf-textarea:focus {
  border-color: var(--accent);
}
.pf-input::placeholder, .pf-textarea::placeholder { color: rgba(255,255,255,.35); }
.pf-textarea { min-height: 72px; resize: vertical; }
/* min-height: a 44 px tap target for the year picker. */
.pf-select { cursor: pointer; min-height: 44px; }
.pf-select option { color: #1C1C1E; }
.pf-handle-box {
  display: flex; align-items: center; gap: 8px; min-height: 44px;
  background: rgba(255,255,255,.07); border: 0.5px solid rgba(255,255,255,.12);
  border-radius: 12px; padding: 0 14px; transition: border-color .15s;
}
.pf-handle-box:focus-within { border-color: var(--accent); }
.pf-handle-at { color: rgba(255,255,255,.45); font-weight: 600; font-size: 14px; }
.pf-handle-input {
  flex: 1; min-width: 80px; min-height: 42px; border: none; background: none; outline: none;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: white;
}
.pf-handle-input::placeholder { color: rgba(255,255,255,.35); }
/* Wraps rather than squeezing the input: the skip card's box is ~250 px, and
   "couldn't check. we'll check when you continue" is wider than that. */
.pf-handle-status { font-size: 12px; font-weight: 600; line-height: 1.3; text-align: right; }
.pf-fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
.pf-looking-wrap {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 4px;
}
.pf-looking-row {
  display: flex; align-items: center; gap: 10px; min-height: 44px;
  font-size: 13px; color: rgba(255,255,255,.82);
  cursor: pointer;
}
.pf-looking-row input { accent-color: var(--accent); width: 15px; height: 15px; }

/* Confirm dialog (close button on top) */
.confirm-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-card {
  background: #1f1f22; border: 0.5px solid rgba(255,255,255,.1);
  border-radius: 16px; padding: 24px 28px; max-width: 360px; text-align: center;
  box-shadow: 0 24px 64px rgba(0,0,0,.5);
}
.confirm-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 800; color: white; letter-spacing: -.4px; margin-bottom: 8px; }
.confirm-body { font-size: 13px; color: rgba(255,255,255,.65); line-height: 1.55; margin-bottom: 18px; }
.confirm-row { display: flex; gap: 8px; justify-content: center; }

.confirm-card .btn-coral, .confirm-card .btn-skip-step { min-height: 44px; }
.confirm-card .btn-coral:disabled { opacity: .7; }
/* The identity variant asks for a name and handle before skipping. */
.skip-identity {
  display: flex; flex-direction: column; gap: 12px;
  text-align: left; margin: 0 0 18px;
}

/* Shared step pieces: every tappable control is at least 44 px tall. */
.cta-row { flex-wrap: wrap; justify-content: center; }
.btn-coral, .btn-skip-step { min-height: 44px; }
.onb-step[data-step="2"], .onb-step[data-step="5"], .onb-step[data-step="6"] { max-width: 560px; }
.onb-list { width: 100%; text-align: left; }
[hidden] { display: none !important; }

/* Step 2 — campus radio cards */
.campus-list { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
.campus-card {
  display: flex; align-items: flex-start; gap: 12px; min-height: 56px;
  padding: 12px 14px; border-radius: 12px; cursor: pointer;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10); color: white;
  transition: background .15s, border-color .15s;
}
.campus-card:hover { background: rgba(255,255,255,.07); }
.campus-card.selected { background: rgba(255,92,53,.12); border-color: var(--accent); }
.campus-card input { accent-color: var(--accent); width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; }
.campus-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.campus-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.campus-title { font-size: 15px; font-weight: 600; }
.campus-sub { font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.55); }
.campus-tag, .campus-soon {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 7px; white-space: nowrap;
}
.campus-tag { color: var(--lavender); background: rgba(200,184,255,.12); border: 1px solid rgba(200,184,255,.30); }
.campus-soon { color: rgba(255,255,255,.55); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }
.onb-campus-wrap { width: 100%; text-align: left; margin-top: 4px; }
.onb-campus-wrap .pf-hint { font-style: normal; }
.onb-text-btn {
  min-height: 44px; margin-top: 10px; padding: 10px 4px; background: none; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; line-height: 1.4; text-align: left;
  color: var(--lavender); text-decoration: underline; text-underline-offset: 3px;
}
.onb-text-btn:disabled { opacity: .5; }
.purdue-panel {
  display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding: 14px;
  border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.10);
}
.purdue-panel .btn-coral { align-self: flex-start; }
.purdue-panel .btn-skip-step { align-self: flex-start; padding-left: 4px; }
.purdue-panel .pf-hint { font-style: normal; }

/* Steps 5–6 — club and people rows */
.pick-list { list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; }
.pick-row {
  display: flex; flex-direction: column; gap: 12px; padding: 12px 14px; border-radius: 14px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.10); color: white;
}
.pick-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.pick-logo {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #26252A; border: 1px solid rgba(255,255,255,.10); color: rgba(255,255,255,.85);
  font-family: 'Fraunces', serif; font-size: 17px; font-weight: 800;
}
.pick-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pick-name-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pick-name { font-size: 15px; font-weight: 700; line-height: 1.3; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-verified {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 14px; height: 14px; border-radius: 50%; background: var(--green); color: #fff; font-size: 9px; font-weight: 900;
}
.pick-chip {
  flex-shrink: 0; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 999px; padding: 2px 7px; white-space: nowrap;
  color: var(--lavender); background: rgba(200,184,255,.12); border: 1px solid rgba(200,184,255,.30);
}
.pick-meta { font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.55); overflow-wrap: anywhere; }
.pick-sub { font-size: 12px; line-height: 1.4; color: rgba(255,255,255,.5); }
.pick-sub.invite { color: rgba(255,255,255,.7); }
.pick-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.pick-actions.line { width: 100%; }
.pick-actions.line .pick-btn { flex: 1 1 0; min-width: 0; }
.pick-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 700; line-height: 1.2;
  text-align: center; text-decoration: none; white-space: nowrap; transition: opacity .15s, background .15s;
}
.pick-btn.filled { color: #fff; background: var(--accent); border: 1px solid var(--accent); }
.pick-btn.outline { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.28); }
.pick-btn.quiet { color: rgba(255,255,255,.85); background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
.pick-btn.locked { opacity: .6; }
.pick-search { margin-bottom: 12px; }
.pick-sparse { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.6); margin: 0 0 14px; text-align: center; }
.skel { display: block; border-radius: 6px; background: rgba(255,255,255,.08); }
.pick-row.skel-row { opacity: .6; }
.group-label {
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(255,255,255,.5); margin: 18px 0 8px;
}
.people-group:first-child .group-label { margin-top: 0; }
.onb-empty {
  width: 100%; padding: 22px 18px; border-radius: 16px; text-align: center;
  border: 1px dashed rgba(255,255,255,.14);
}

.onb-empty .sub-intro { margin: 0 auto 16px; }
.people-top { width: 100%; text-align: center; margin-bottom: 16px; }
.people-top .sub-intro { margin: 0 auto 12px; }
.btn-share {
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
  color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.28);
}

/* Step 4 — photo */
.photo-circle {
  width: 132px; height: 132px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; margin: 6px auto 0;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10);
}
.photo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-initial { font-family: 'Fraunces', serif; font-size: 52px; font-weight: 900; color: rgba(255,255,255,.8); line-height: 1; }
#onbPhotoError { text-align: center; margin-top: 14px; }

/* Responsive */
@media (max-width: 540px) {
  .h1 { font-size: 30px; }
  .h2 { font-size: 24px; }
  .pf-form { max-width: 100%; }
  .progress-dots { padding: 6px 12px; }
  .progress-text { display: none; }
}

/* ── Hyperdrive on Finish — same beat as the landing's warp ─────────────── */
.ott-warp {
  position: fixed; inset: 0; pointer-events: none; z-index: 9990;
  opacity: 0; transition: opacity 80ms ease;
}
.ott-warp.active { opacity: 1; }
.ott-warp-streak {
  position: absolute; top: 50%; left: 50%;
  width: 2px; height: 2px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 8px #ffffff, 0 0 18px #ffe5db, 0 0 36px rgba(255,92,53,.8);
  transform: translate(-50%, -50%);
  will-change: transform, opacity;
}
.ott-warp.active .ott-warp-streak {
  animation: ott-warp-streak 750ms cubic-bezier(0.5, 0, 0.85, 0.4) forwards;
}
.ott-warp::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, #ffd9b5 0%, #ffe5db 40%, #ffffff 100%);
  opacity: 0; pointer-events: none;
}
.ott-warp.active::after {
  animation: ott-warp-flash 750ms ease-in forwards;
}
body.ott-warping main.onb-shell,
body.ott-warping .progress-dots {
  animation: ott-warp-content 750ms cubic-bezier(0.6, 0, 0.85, 0.3) forwards;
  transform-origin: 50% 50%;
}
@keyframes ott-warp-streak {
  0%   { transform: translate(-50%, -50%) rotate(var(--ang)) scaleX(1) scaleY(1); opacity: .9; }
  25%  { transform: translate(-50%, -50%) rotate(var(--ang)) scaleX(18) scaleY(1.2); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--cos) * 2800px), calc(-50% + var(--sin) * 2800px)) rotate(var(--ang)) scaleX(90) scaleY(0.6); opacity: 0; }
}
@keyframes ott-warp-flash {
  0%  { opacity: 0; }
  80% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes ott-warp-content {
  0%   { transform: scale(1); opacity: 1; filter: blur(0); }
  35%  { transform: scale(1.15); opacity: .9; filter: blur(2px); }
  100% { transform: scale(8); opacity: 0; filter: blur(22px); }
}
@media (prefers-reduced-motion: reduce) {
  .ott-warp.active .ott-warp-streak,
  body.ott-warping main.onb-shell,
  body.ott-warping .progress-dots { animation: none !important; }
}

<script>
// ══════════════════════════════════════════════════════════════════════════
// Desktop Otto onboarding: six steps, the same flow as the phone
// (src/components/mobile/OnboardingMobile.tsx and ./onboarding/*.tsx; wave
// plan handoffs/2026-09-16-wave-plan-follow-onboarding-edit.md §9 B13).
//
//   1 hello → 2 campus → 3 profile → 4 photo → 5 follow clubs → 6 people
//
// SAVES AS YOU GO. Continue on the campus and profile steps writes that step
// through POST /api/me/onboarding-step; the photo saves the moment it's
// cropped; club and person follows save on tap. Finish (and Skip) only mark
// onboarding done, after catching up a campus or profile change that never
// went through a Continue. Everything typed is also kept in the localStorage
// draft the phone uses (same key, same schema), so a reload comes back to the
// same step with the same text. Replay (?replay=1) reads live data but never
// reads, writes or clears the draft and sends no non-GET request.
//
// ONE BACK. The header's Back and the browser's Back are the same thing:
// every step is a same-URL history entry carrying `onbStep`, and a popstate
// listener shows that step. While something is saving, a Back is undone.
//
// The page is served inside an iframe (OnboardingSwitch.tsx), so leaving goes
// through window.__vibeTopNav, and history entries join the top window's.
//
// SAFETY. Server text (club and people names, handles, errors) reaches the
// DOM only through textContent / createElement; no HTML string is ever parsed
// (the two markup resets below only empty an element). Image sources are only
// safeImgSrc(value) or a blob: URL this page made.
// ══════════════════════════════════════════════════════════════════════════

// ── Boot payload (plan §3.3) ─────────────────────────────────────────────
// /onboarding/classic injects <script id="onbBoot" type="application/json">
// with the signed-in user's id (the draft key), the university the school
// email PROVED (`system`), the campus the address points at on its own
// (`singleCampusId`) and the server prefill.
function readOnbBoot() {
  try {
    const el = document.getElementById('onbBoot');
    if (!el) return null;
    const parsed = JSON.parse(el.textContent || 'null');
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
  } catch (e) {
    return null;
  }
}
const ONB_BOOT = readOnbBoot() || {};
const ONB_PREFILL = ONB_BOOT.prefill && typeof ONB_BOOT.prefill === 'object' ? ONB_BOOT.prefill : {};

// ── Replay mode ───────────────────────────────────────────────────────────
// `?replay=1` (or the boot's own flag) re-views onboarding after it's done:
// nothing is saved, and a pill says so. Declared after ONB_BOOT on purpose.
const IS_REPLAY = new URLSearchParams(window.location.search).get('replay') === '1' || ONB_BOOT.replay === true;
if (IS_REPLAY) {
  const pill = document.getElementById('replayPill');
  if (pill) pill.hidden = false;
}

/* ONB-PURE-MIRROR:START */
// ── Pure mirror of the phone's TS sources ────────────────────────────────
// Constants and pure functions ONLY (no DOM, no storage, no requests), so a
// parity script can evaluate this block in node and compare every export
// with the TS it copies. Change a TS source → change this block too:
//   ONB_COPY, fillCampus        src/components/mobile/onboarding/onb-copy.ts
//   ORG_COPY, orgRowView, …     src/lib/orgs/join-copy.ts
//   PHOTO_ERROR_COPY, preflight src/lib/profile/avatar-upload.ts
//   parseClubRows … listState   src/lib/onboarding/social-steps.ts
//   campus model                src/lib/iu/campuses.ts
//   draft record, resume step   src/lib/onboarding/draft.ts
//   ONB_LOCAL_COPY, profile     src/components/mobile/onboarding/Step*.tsx
//                               and OnboardingMobile.tsx (their local strings)
//   isSafeRelativePath          src/lib/auth/login-next.ts

const ONB_COPY = Object.freeze({

    ottoPurdue: "“your school email says Purdue. pick your campus. Indianapolis is shared with IU students.”",
    note: "Your school email shows you're at {system}. You can move to another {system} campus later in Settings.",
    fromEmailTag: "from your school email",
    notOpen: "not open yet",
    required: "Pick your campus to continue.",
    invalid: "Pick one of your university's campuses.",
    purdueLink: "Purdue student with an IU email? Verify your @purdue.edu instead",
    switchLabel: "Your @purdue.edu email",
    switchPlaceholder: "you@purdue.edu",
    switchSend: "Send code",
    switchSending: "Sending…",
    switchWrongDomain: "Use your @purdue.edu address.",
    switchSent: "Check your school inbox.",
    switchCodeLabel: "8-digit code",
    switchVerify: "Verify",
    switchVerifying: "Verifying…",
    switchDone: "You're verified as a Purdue student.",
    switchCancel: "Never mind",
    continue: "Continue →",
    saving: "Saving…",
  }),
  profile: Object.freeze({
    title: "let's pin down your profile",
    sub: "“same fields as your Vibe profile. name and handle are the must-haves. a photo is next.”",
    labels: Object.freeze({
      name: "Name (required)",
      handle: "Handle (required)",
      bio: "Bio (optional)",
      major: "Major (optional)",
      department: "Department / school (optional)",
      year: "Year (optional)",

    majorHintFree: "Type your major",
    handleChecking: "checking…",
    handleAvailable: "✓ available",
    handleTaken: "✗ taken",
    handleReason: "✗ {reason}",
    handleFormat: "✗ 3–20 letters, numbers or _",
    handleUnchecked: "couldn't check. we'll check when you continue",
    errors: Object.freeze({
      nameRequired: "Add your name. It's how people recognize you.",
      handleRequired: "Pick a handle so friends can find you.",
      handleInvalid: "3–20 letters, numbers or _.",
      handleTaken: "That handle is taken. Try another.",
      handleReserved: "That handle is reserved.",
    }),

    continue: "Continue →",
    saving: "Saving…",
  }),
  photo: Object.freeze({
    title: "put a face to the name",
    otto: "“people follow faces. add a photo so classmates know it's you. swap it any time.”",
    choose: "Choose a photo",
    skip: "Skip for now",
    uploading: "Uploading…",
    change: "Change photo",
    continue: "Continue →",
  }),
  clubs: Object.freeze({
    title: "Follow clubs",
    sub: "Their posts show up in your feed. You can join the ones that let you.",
    search: "Search clubs by name",
    sparse: "Clubs are just getting started at {campus}. Follow the ones you like — posts land in your feed.",

/** onb-copy.ts: every `{campus}` filled in one pass; a blank campus → `fallback`. */
function fillCampus(t, campus, fallback) {
  const name = typeof campus === "string" ? campus.trim() : "";
  if (!name) return fallback;
  return t.replace(/\{campus\}/g, () => name);
}

// ── Clubs: join-copy.ts (orgRowView's "onboarding" surface) ──────────────

/** Said near Follow on any club not known to be open (join-copy.ts). */
const FOLLOW_DISCLOSURE = "Officers can see who follows this club.";

/** `{key}` placeholders in one pass; unknown keys stay as written. */
function fillCopy(template, vars) {
  return template.replace(/\{(\w+)\}/g, (whole, key) =>
    Object.prototype.hasOwnProperty.call(vars, key) ? String(vars[key]) : whole,
  );
}

/** 'Sep 16' in US English, or null for a missing or unparseable timestamp. */
function shortDateText(iso, timeZone) {
  if (!iso) return null;
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return null;
  return date.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone });
}

function orgAction(kind, label, tone, extra) {
  return {
    kind,
    label,
    sub: (extra && extra.sub) ?? null,
    tone,
    disabled: (extra && extra.disabled) ?? false,
    href: (extra && extra.href) ?? null,
  };
}

function orgFollowToggle(following, followTone) {
  return following
    ? orgAction("unfollow", ORG_COPY.buttons.following, "quiet")
    : orgAction("follow", ORG_COPY.buttons.follow, followTone || "filled");
}

function orgSignInAction(handle) {
  return orgAction("sign_in", ORG_COPY.buttons.signInToFollow, "filled", {
    href: "/auth/login?next=" + encodeURIComponent("/orgs/" + handle),
  });
}

/** Any club not known to be open (`joinPolicy !== "open"`) says officers see followers. */
function orgWantsDisclosure(rel, showsFollow) {
  return (
    rel.joinPolicy !== "open" &&
    showsFollow &&
    rel.state !== "member" &&
    rel.state !== "hidden" &&
    rel.state !== "signed_out"
  );
}

function orgRowMeta(rel) {
  const meta = [];
  if (rel.joinPolicy === "request") meta.push(ORG_COPY.meta.byRequest);
  else if (rel.joinPolicy === "invite") meta.push(ORG_COPY.meta.inviteOnly);
  if (rel.state === "requested") meta.push(ORG_COPY.meta.requested);
  if (rel.audience === "iu") meta.push(ORG_COPY.meta.iuOnly);
  else if (rel.audience === "purdue") meta.push(ORG_COPY.meta.purdueOnly);
  if (rel.state === "hidden") meta.push(ORG_COPY.meta.hidden);
  return meta;
}

/**
 * orgRowView(rel, "onboarding"): one or two controls, a chip that never
 * repeats a control, meta labels. Onboarding never offers Request, and an
 * open club puts Follow and Join side by side (`line`).
 */
function orgRowViewOnboarding(rel) {
  let actions;
  let chip = null;
  let layout = "slot";
  let sub = null;

  switch (rel.state) {
    case "signed_out":
      actions = [orgSignInAction(rel.handle)];
      break;
    case "member":
      actions = [orgAction("status", ORG_COPY.buttons.joined, "quiet", { disabled: true })];
      sub = ORG_COPY.subs.membersFollow;
      break;
    case "hidden":
      actions = [orgAction("status", ORG_COPY.buttons.hidden, "quiet", { disabled: true })];
      break;
    case "invited":
      chip = ORG_COPY.chips.invitedYou;
      actions = [orgAction("accept", ORG_COPY.buttons.accept, "filled")];
      break;
    case "can_join":
      actions = rel.following
        ? [
            orgAction("unfollow", ORG_COPY.buttons.following, "quiet"),
            orgAction("join", ORG_COPY.buttons.join, "filled"),
          ]
        : [
            orgAction("follow", ORG_COPY.buttons.follow, "filled"),
            orgAction("join", ORG_COPY.buttons.join, "outline"),
          ];
      layout = "line";
      break;
    case "can_request":
      actions = rel.following
        ? [orgAction("unfollow", ORG_COPY.buttons.following, "quiet")]
        : [orgAction("follow", ORG_COPY.buttons.follow, "filled")];
      break;
    case "requested":
    case "invite_only":
    case "audience_blocked":
    case "unverified":
      actions = [orgFollowToggle(rel.following)];
      break;
  }

  const showsFollow = actions.some((a) => a.kind === "follow" || a.kind === "unfollow");
  return {
    chip,
    actions,
    layout,
    disclosure: orgWantsDisclosure(rel, showsFollow) ? FOLLOW_DISCLOSURE : null,
    meta: orgRowMeta(rel),
    sub,
  };
}

/** 'Invited by Franky · Expires Oct 16'; no inviter → "an officer"; a bad expiry drops the date. */
function inviteSubText(firstName, expiresIso, timeZone) {
  const name = (firstName ?? "").trim();
  const date = shortDateText(expiresIso, timeZone);
  const template = name ? ORG_COPY.inviteSub.byName : ORG_COPY.inviteSub.byOfficer;
  const filled = fillCopy(template, { name, date: date ?? "" });
  return date ? filled : filled.replace(/ · Expires $/, "");
}

/** The toast for a refused club request, by code (or 429); null → no club line. */
function orgErrorCopy(code) {
  switch (code) {
    case 429:
    case "429":
      return ORG_COPY.errors.tooMany;
    case "not_found":
      return ORG_COPY.errors.notFound;
    case "member_follows":
      return ORG_COPY.errors.memberFollows;
    case "org_hidden":
      return ORG_COPY.errors.orgHidden;
    case "invite_not_found":
    case "invite_not_pending":
      return ORG_COPY.errors.inviteClosed;
    default:
      return null;
  }
}

/** Where a declined invite leaves them; a null policy reads as "ask". */
function stateAfterDecline(joinPolicy) {
  if (joinPolicy === "open") return "can_join";
  if (joinPolicy === "invite") return "invite_only";
  return "can_request";
}

/** The next standing for a tap that succeeded (or replay's unsent tap); null for links and labels. */
function changeAfter(rel, kind) {
  switch (kind) {
    case "follow":
      return { state: rel.state, following: true, role: rel.role };
    case "unfollow":
      return { state: rel.state, following: false, role: rel.role };
    case "join":
    case "accept":
      return { state: "member", following: true, role: rel.role ?? "member" };
    case "request":
      return { state: "requested", following: rel.following, role: rel.role };
    case "decline":
      return {
        state: stateAfterDecline(rel.joinPolicy),
        following: rel.following,
        role: rel.role,
        declined: true,
      };
    default:
      return null;
  }
}

/** join-state.ts isOrgRole. */
function isOrgRole(value) {
  return value === "owner" || value === "admin" || value === "mod" || value === "member";
}

/** OrgJoinControl.tsx: `audience_mismatch` names the university only in its sentence. */
function audienceFromRefusal(error, fallback) {
  const text = typeof error === "string" ? error : "";
  if (/open to Purdue students only\.?$/.test(text)) return "purdue";
  if (/open to IU students only\.?$/.test(text)) return "iu";
  return fallback;
}

// ── social-steps.ts: the clubs and people steps' pure half ────────────────

const CLUB_JOIN_STATES = Object.freeze([
  "member", "invited", "requested", "can_join", "can_request",
  "invite_only", "audience_blocked", "unverified", "hidden",
]);
const CLUB_ORG_ROLES = Object.freeze(["owner", "admin", "mod", "member"]);

function asRecord(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value) ? value : null;
}

/** A trimmed, non-empty string, or null. */
function trimmedText(value) {
  if (typeof value !== "string") return null;
  const trimmed = value.trim();
  return trimmed ? trimmed : null;
}

function oneOf(value, allowed) {
  return typeof value === "string" && allowed.includes(value) ? value : null;
}

/** Discover rows, typed; drops rows missing id/handle/name/join_state and repeats. */
function parseClubRows(raw) {
  if (!Array.isArray(raw)) return [];
  const seen = [];
  const rows = [];
  for (const item of raw) {
    const r = asRecord(item);
    if (!r) continue;
    const id = trimmedText(r.id);
    const handle = trimmedText(r.handle);
    const name = trimmedText(r.name);
    const joinState = oneOf(r.join_state, CLUB_JOIN_STATES);
    if (!id || !handle || !name || !joinState || seen.includes(id)) continue;
    seen.push(id);

    const invite = asRecord(r.pending_invite);
    const inviteId = invite ? trimmedText(invite.id) : null;
    const inviteExpires = invite ? trimmedText(invite.expires_at) : null;
    const followState = oneOf(r.org_follow_state, ["following", "not_following"]);

    const row = {
      id,
      handle,
      name,
      logo_url: trimmedText(r.logo_url),
      verified: r.verified === true,
      join_policy: oneOf(r.join_policy, ["open", "request", "invite"]) ?? "request",
      audience: oneOf(r.audience, ["both", "iu", "purdue"]) ?? "both",
      join_state: joinState,
      join_reason: oneOf(r.join_reason, ["policy", "visiting"]),
      role: oneOf(r.role, CLUB_ORG_ROLES),
      pending_invite:
        invite && inviteId && inviteExpires
          ? { id: inviteId, expires_at: inviteExpires, invited_by_name: trimmedText(invite.invited_by_name) }
          : null,
    };
    if (followState) row.org_follow_state = followState;
    rows.push(row);
  }
  return rows;
}

/** Plan §4.2: following (org_follow_state), or a member (members always follow). */
function isFollowingOrg(r) {
  return r.org_follow_state === "following" || r.role != null || r.join_state === "member";
}

/** Invite first, then open, by request, invite-only; followed or joined last. */
function clubBand(r) {
  if (r.join_state === "invited") return 0;
  if (isFollowingOrg(r)) return 4;
  if (r.join_policy === "open") return 1;
  if (r.join_policy === "request") return 2;
  return 3;
}

/** Stable sort by clubBand, once on load: a row never jumps away from a tap. */
function orderClubRows(rows) {
  return rows
    .map((row, index) => ({ row, index, band: clubBand(row) }))
    .sort((a, b) => a.band - b.band || a.index - b.index)
    .map((entry) => entry.row);
}

/** The OrgRelation the row renders, with this step's own answers on top. */
function relationFor(r, local) {
  const state = (local && local.state) ?? r.join_state;
  return {
    handle: r.handle,
    orgName: r.name,
    state,
    following: state === "member" ? true : ((local && local.following) ?? isFollowingOrg(r)),
    role: (local && local.role) ?? r.role,
    reason: r.join_reason,
    audience: r.audience,
    joinPolicy: r.join_policy,
  };
}

/** True when any row, with this step's taps applied, is followed or joined. */
function anyClubFollowed(rows, local) {
  return rows.some((r) => relationFor(r, local[r.id]).following);
}

/** Mirrors ONB_COPY.people.group* (social-steps.ts keeps its own copy too). */
const PEOPLE_GROUP_LABELS = Object.freeze({
  clubs: "From your clubs",
  campus: "At {campus}",
  campusFallback: "On your campus",
  major: "Same major",
  system: "Elsewhere at {system}",
  more: "More people on Vibe",
});
const PEOPLE_GROUP_ORDER = Object.freeze(["clubs", "campus", "major", "system", "more"]);

/** `{ suggestions }` rows, typed; drops rows with no id, no name and no handle, and repeats. */
function parseSuggestions(raw) {
  if (!Array.isArray(raw)) return [];
  const seen = [];
  const people = [];
  for (const item of raw) {
    const r = asRecord(item);
    if (!r) continue;
    const id = trimmedText(r.id);
    const name = trimmedText(r.name);
    const handle = trimmedText(r.handle);
    if (!id || (!name && !handle) || seen.includes(id)) continue;
    seen.push(id);
    const person = {
      id,
      name,
      handle,
      avatar_url: trimmedText(r.avatar_url),
      major: trimmedText(r.major),
      campus_id: trimmedText(r.campus_id),
      school_system: oneOf(r.school_system, ["iu", "purdue"]),
    };
    const reason = trimmedText(r.reason_v2);
    if (reason) person.reason_v2 = reason;
    people.push(person);
  }
  return people;
}

/**
 * Buckets suggestions by `reason_v2` in the order clubs, campus, major,
 * system, more; server order inside a group; empty groups dropped.
 */
function groupPeople(list, o) {
  const buckets = { clubs: [], campus: [], major: [], system: [], more: [] };
  for (const person of list) {
    switch (person.reason_v2) {
      case "from_your_clubs":
        buckets.clubs.push(person);
        break;
      case "same_campus":
        buckets.campus.push(person);
        break;
      case "same_major":
        buckets.major.push(person);
        break;
      case "same_system":
        if (o.system ?? person.school_system) buckets.system.push(person);
        else buckets.more.push(person);
        break;
      default:
        buckets.more.push(person);
    }
  }

  const labelFor = (key, people) => {
    const first = people[0];
    switch (key) {
      case "clubs":
        return PEOPLE_GROUP_LABELS.clubs;
      case "campus": {
        const row = campusRowById(first ? first.campus_id : undefined);
        const campus = (o.campusShortName ?? "").trim() || (row ? row.shortName : "") || "";
        return campus
          ? PEOPLE_GROUP_LABELS.campus.replace("{campus}", () => campus)
          : PEOPLE_GROUP_LABELS.campusFallback;
      }
      case "major":
        return PEOPLE_GROUP_LABELS.major;
      case "system": {
        const system = o.system ?? (first ? first.school_system : undefined) ?? "iu";
        return PEOPLE_GROUP_LABELS.system.replace("{system}", SYSTEM_LABEL[system]);
      }
      case "more":
        return PEOPLE_GROUP_LABELS.more;
    }
  };

  return PEOPLE_GROUP_ORDER.filter((key) => buckets[key].length > 0).map((key) => ({
    key,
    label: labelFor(key, buckets[key]),
    people: buckets[key],
  }));
}

/** 0 → "empty", 1–2 → "sparse", 3 or more → "full". */
function listState(n) {
  if (!(n >= 1)) return "empty";
  return n < 3 ? "sparse" : "full";
}

// ── campuses.ts: the campus model ────────────────────────────────────────
// Drift can only mis-OFFER a campus: the step route checks every pick against
// the system the server stamped, and `users_campus_in_system` refuses the
// rest, so nothing here can write a campus into the wrong university.

const SYSTEM_LABEL = Object.freeze({ iu: "IU", purdue: "Purdue" });
const CAMPUS_ROWS = Object.freeze([
  // Shared: one community for both universities.
  Object.freeze({ id: "indianapolis", name: "Indianapolis", shortName: "Indianapolis", systems: Object.freeze(["iu", "purdue"]), sort: 0, isOpen: true }),
  Object.freeze({ id: "fort-wayne", name: "Fort Wayne", shortName: "Fort Wayne", systems: Object.freeze(["iu", "purdue"]), sort: 10, isOpen: false }),
  // IU
  Object.freeze({ id: "iu-bloomington", name: "IU Bloomington", shortName: "Bloomington", systems: Object.freeze(["iu"]), sort: 20, isOpen: false }),
  Object.freeze({ id: "iu-columbus", name: "IU Columbus", shortName: "Columbus", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  Object.freeze({ id: "iu-east", name: "IU East", shortName: "East", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  Object.freeze({ id: "iu-kokomo", name: "IU Kokomo", shortName: "Kokomo", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  Object.freeze({ id: "iu-northwest", name: "IU Northwest", shortName: "Northwest", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  Object.freeze({ id: "iu-south-bend", name: "IU South Bend", shortName: "South Bend", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  Object.freeze({ id: "iu-southeast", name: "IU Southeast", shortName: "Southeast", systems: Object.freeze(["iu"]), sort: 30, isOpen: false }),
  // Purdue
  Object.freeze({ id: "purdue-west-lafayette", name: "Purdue West Lafayette", shortName: "West Lafayette", systems: Object.freeze(["purdue"]), sort: 20, isOpen: false }),
  Object.freeze({ id: "purdue-northwest", name: "Purdue Northwest", shortName: "Northwest", systems: Object.freeze(["purdue"]), sort: 30, isOpen: false }),
]);
/** Former names, said once and only in the picker (plan §2.5 copy rules). */
const CAMPUS_FORMERLY = Object.freeze({ indianapolis: "IUPUI" });

function isSchoolSystem(value) {
  return value === "iu" || value === "purdue";
}

/** A campus row by id (trimmed, any casing), or null. */
function campusRowById(id) {
  if (typeof id !== "string") return null;
  const key = id.trim().toLowerCase();
  if (!key) return null;
  for (let i = 0; i < CAMPUS_ROWS.length; i++) {
    if (CAMPUS_ROWS[i].id === key) return CAMPUS_ROWS[i];
  }
  return null;
}

/** The allowed set for a system, shared communities first, then sort, then name. */
function campusesForSystem(system) {
  if (!isSchoolSystem(system)) return [];
  return CAMPUS_ROWS.filter((c) => c.systems.includes(system)).sort((a, b) => {
    const shared = Number(b.systems.length > 1) - Number(a.systems.length > 1);
    if (shared !== 0) return shared;
    if (a.sort !== b.sort) return a.sort - b.sort;
    return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
  });
}

/** The canonical id when `id` names a campus in `system`'s allowed set, else null. */
function allowedCampusId(id, system) {
  if (!isSchoolSystem(system) || typeof id !== "string") return null;
  const row = campusRowById(id);
  return row && row.systems.includes(system) ? row.id : null;
}

/** Whether `id` is one of `system`'s campuses (a null system allows nothing). */
function campusAllowed(id, system) {
  return allowedCampusId(id, system) !== null;
}

/**
 * The card's sub-line, seen from the student's own side:
 *   IU:     "IU Indianapolis · one community with Purdue Indianapolis (formerly IUPUI)"
 *   Purdue: "Purdue Indianapolis · one community with IU Indianapolis (formerly IUPUI)"
 * A single-system campus just says its full name ("IU Bloomington").
 */
function campusPickerSub(c, system) {
  if (!c || !SYSTEM_LABEL[system] || !c.systems.includes(system)) return c ? c.name : "";
  if (c.systems.length < 2) return c.name;
  const others = c.systems
    .filter((s) => s !== system)
    .map((s) => SYSTEM_LABEL[s] + " " + c.shortName);
  const formerly = CAMPUS_FORMERLY[c.id];
  return SYSTEM_LABEL[system] + " " + c.shortName + " · one community with " + others.join(" and ")
    + (formerly ? " (formerly " + formerly + ")" : "");
}

// ── draft.ts: the storage contract shared with the phone ─────────────────
//   key    `vibe_onb_draft_v1:<userId>`
//   value  JSON `{ v: 1, step, maxStep, fields, at }` (`at` = epoch ms)
//   TTL    14 days from `at`; an expired or unreadable draft is removed
//   fields the ten DRAFT_FIELD_KEYS; interests / skills are the RAW text

const DRAFT_KEY_PREFIX = "vibe_onb_draft_v1:";
const DRAFT_VERSION = 1;
const DRAFT_TTL_MS = 14 * 24 * 60 * 60 * 1000;
const DRAFT_SAVE_DELAY_MS = 300;
const DRAFT_TOTAL_STEPS = 6;
const DRAFT_FUTURE_SKEW_MS = 24 * 60 * 60 * 1000;
const DRAFT_MAX_FIELDS = 64;
const DRAFT_MAX_STRING = 8000;
const DRAFT_MAX_LIST = 100;
const DRAFT_UNSAFE_KEYS = Object.freeze(["__proto__", "constructor", "prototype"]);
const DRAFT_FIELD_KEYS = Object.freeze([
  "campus_id",
  "name",
  "handle",
  "bio",
  "major",
  "department",
  "year",
  "interests",
  "skills",
  "looking_for",
]);
const DRAFT_YEARS = Object.freeze(["", "1", "2", "3", "4", "5"]);

/** The storage key for a user's draft, or null for a missing / blank id. */
function draftKey(userId) {
  if (typeof userId !== "string") return null;
  const id = userId.trim();
  if (!id || id.length > 200) return null;
  return DRAFT_KEY_PREFIX + id;
}

function draftStep(value) {
  return typeof value === "number" && Number.isInteger(value) && value >= 1 && value <= DRAFT_TOTAL_STEPS
    ? value
    : null;
}

/** JSON-safe values of the allowed shapes, capped; a non-object is null. */
function sanitizeDraftFields(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  const out = {};
  let count = 0;
  for (const [key, value] of Object.entries(raw)) {
    if (count >= DRAFT_MAX_FIELDS) break;
    if (DRAFT_UNSAFE_KEYS.includes(key)) continue;
    if (typeof value === "string") {
      out[key] = value.slice(0, DRAFT_MAX_STRING);
    } else if (typeof value === "number") {
      if (!Number.isFinite(value)) continue;
      out[key] = value;
    } else if (typeof value === "boolean" || value === null) {
      out[key] = value;
    } else if (Array.isArray(value)) {
      out[key] = value
        .filter((item) => typeof item === "string")
        .slice(0, DRAFT_MAX_LIST)
        .map((item) => item.slice(0, DRAFT_MAX_STRING));
    } else {
      continue;
    }
    count++;
  }
  return out;
}

/** loadDraft's rules on a raw stored value: the record, or null (the caller removes it). */
function readDraftRecord(raw, now) {
  if (raw === null || raw === undefined) return null;
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    return null;
  }
  if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return null;
  if (parsed.v !== DRAFT_VERSION) return null;
  const at = parsed.at;
  if (typeof at !== "number" || !Number.isFinite(at)) return null;
  if (now - at >= DRAFT_TTL_MS || at - now > DRAFT_FUTURE_SKEW_MS) return null;
  const step = draftStep(parsed.step);
  if (step === null) return null;
  const fields = sanitizeDraftFields(parsed.fields);
  if (fields === null) return null;
  return { v: DRAFT_VERSION, step, maxStep: Math.max(step, draftStep(parsed.maxStep) ?? step), fields, at };
}

/** saveDraft's record for `{ step, maxStep, fields }` at `now`, or null when it can't be saved. */
function buildDraftRecord(draft, now) {
  if (!draft || typeof draft !== "object") return null;
  const step = draftStep(draft.step);
  if (step === null) return null;
  const fields = sanitizeDraftFields(draft.fields);
  if (fields === null) return null;
  return { v: DRAFT_VERSION, step, maxStep: Math.max(step, draftStep(draft.maxStep) ?? step), fields, at: now };
}

/** The step to open on: the draft's, else photo / profile / hello by what's saved. */
function onboardingStartStep(draft, saved) {
  if (draft) return Math.min(draft.step, draft.maxStep);
  const campusSaved = Boolean(saved.campusId) && saved.campusConfirmed === true;
  if (campusSaved && saved.hasRealHandle) return 4;
  if (campusSaved) return 3;
  return 1;
}

/** The draft's typed fields: text keys as strings, a valid year, a deduplicated looking_for. */
function typedDraftFields(fields) {
  const out = {};
  if (!fields || typeof fields !== "object" || Array.isArray(fields)) return out;
  for (const key of DRAFT_FIELD_KEYS) {
    if (!Object.prototype.hasOwnProperty.call(fields, key)) continue;
    const value = fields[key];
    if (key === "looking_for") {
      if (Array.isArray(value)) {
        const seen = [];
        for (const item of value) if (typeof item === "string" && !seen.includes(item)) seen.push(item);
        out.looking_for = seen;
      }
    } else if (key === "year") {
      if (typeof value === "string" && DRAFT_YEARS.includes(value)) out.year = value;
    } else if (typeof value === "string") {
      out[key] = value;
    }
  }
  return out;
}

/** onboardingStartStep, pulled back to campus (2) while none is saved and to profile (3) while no handle is. */
function onboardingResumeStep(draft, saved) {
  let s = onboardingStartStep(draft, saved);
  const campusSaved = !!saved.campusId && saved.campusConfirmed === true;
  if (saved.systemKnown !== false && s > 2 && !campusSaved) s = 2;
  if (s > 3 && !saved.hasRealHandle) s = 3;
  return s;
}

// ── StepProfile.tsx / OnboardingMobile.tsx: the profile step's pure half ──

/** 3–20 lowercase letters, numbers or _ (the server's HANDLE_FORMAT_RE). */
const HANDLE_RE = /^[a-z0-9_]{3,20}$/;
const LOOKING_FOR_VALUES = Object.freeze(["meeting-people", "showing-work", "finding-clubs", "exploring"]);
const PROFILE_FIELD_KEYS = Object.freeze([
  "name", "handle", "bio", "major", "department", "year", "interests", "skills", "looking_for",
]);

/** A select value narrowed to a year the draft and the server accept ("" when not one). */
function asOnboardingYear(value) {
  return DRAFT_YEARS.includes(value) ? value : "";
}

function splitLinesToArray(raw, maxItems, maxLen) {
  const parts = String(raw || "")
    .split(/\n|,/)
    .map((s) => s.trim().slice(0, maxLen))
    .filter(Boolean);
  if (!parts.length) return undefined;
  return parts.slice(0, maxItems);
}

/** POST /api/me/onboarding-step {step:"profile"}: every key, always (an empty value clears it). */
function profileStepBody(f) {
  return {
    name: f.name.trim(),
    handle: f.handle,
    bio: f.bio,
    major: f.major,
    department: f.department,
    year: f.year === "" ? null : Number(f.year),
    interests: splitLinesToArray(f.interests, 10, 40) ?? [],
    skills: splitLinesToArray(f.skills, 12, 30) ?? [],
    looking_for: f.looking_for,
  };
}

/** The step-3 client checks, in order: a name, a handle, a well-formed handle. */
function identityProblem(f) {
  const e = ONB_COPY.profile.errors;
  if (!f.name.trim()) return { field: "name", message: e.nameRequired };
  if (!f.handle) return { field: "handle", message: e.handleRequired };
  if (!HANDLE_RE.test(f.handle)) return { field: "handle", message: e.handleInvalid };
  return null;
}

/** Which step-3 field a refusal belongs to, by code (the static twin carries no `field`). */
function profileFieldForCode(code) {
  if (code === "name_required") return "name";
  if (
    code === "handle_required" ||
    code === "handle_invalid" ||
    code === "handle_reserved" ||
    code === "handle_taken" ||
    code === "handle_cooldown"
  ) {
    return "handle";
  }
  return null;
}

/** Profile fields from the server prefill alone: the base layer of the restore. */
function prefillFields(prefill) {
  const p = prefill || {};
  const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string") : []);
  return {
    name: typeof p.name === "string" ? p.name : "",
    handle: p.hasRealHandle && typeof p.handle === "string" ? p.handle : "",
    bio: typeof p.bio === "string" ? p.bio : "",
    major: typeof p.major === "string" ? p.major : "",
    department: typeof p.department === "string" ? p.department : "",
    year: typeof p.year === "number" && p.year ? asOnboardingYear(String(Math.min(5, p.year))) : "",
    interests: list(p.interests).join(", "),
    skills: list(p.skills).join(", "),
    looking_for: list(p.looking_for).filter((v) => LOOKING_FOR_VALUES.includes(v)),
  };
}

function sameProfileValue(a, b) {
  if (Array.isArray(a) || Array.isArray(b)) {
    return Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.every((v, i) => v === b[i]);
  }
  return a === b;
}

/**
 * The restore (OnboardingMobile.tsx computeBoot): the prefill is the base,
 * the draft overrides typed fields, the server wins for a claimed handle and
 * a confirmed campus. Nothing preselects a campus except the student's own
 * draft pick (while none is confirmed), a confirmed campus, or the visible
 * single-campus preselect from the email (ac014a3).
 */
function restoreOnboarding(input) {
  const replay = input.replay === true;
  const system = isSchoolSystem(input.system) ? input.system : null;
  const p = input.prefill || {};
  const draft = replay ? null : input.draft || null;
  const d = typedDraftFields(draft ? draft.fields : null);
  const base = prefillFields(p);

  const fields = {
    name: d.name ?? base.name,
    handle: p.hasRealHandle ? base.handle : (d.handle ?? ""),
    bio: d.bio ?? base.bio,
    major: d.major ?? base.major,
    department: d.department ?? base.department,
    year: d.year ?? base.year,
    interests: d.interests ?? base.interests,
    skills: d.skills ?? base.skills,
    looking_for: (d.looking_for ?? base.looking_for).filter((v) => LOOKING_FOR_VALUES.includes(v)),
  };

  let campusId = "";
  const draftPick = p.campusConfirmed ? null : allowedCampusId(d.campus_id, system);
  if (draftPick) campusId = draftPick;
  else if (system) {
    campusId =
      (p.campusConfirmed ? allowedCampusId(p.campusId, system) : null) ??
      allowedCampusId(input.singleCampusId, system) ??
      "";
  }

  const saved = {
    campusId: p.campusId,
    campusConfirmed: p.campusConfirmed,
    hasRealHandle: p.hasRealHandle,
    systemKnown: !!system,
  };
  const step = replay ? 1 : onboardingResumeStep(draft, saved);
  const start = replay ? 1 : onboardingStartStep(draft, saved);
  // Pulled back past an unsaved step: nothing above it is reachable yet.
  const maxStep = step < start ? step : Math.max(step, (draft ? draft.maxStep : null) ?? step);

  return {
    system,
    fields,
    campusId,
    savedCampusId: p.campusConfirmed ? allowedCampusId(p.campusId, system) : null,
    identitySaved: !!p.hasRealHandle && !!p.name,
    profileDirty: PROFILE_FIELD_KEYS.some((k) => !sameProfileValue(fields[k], base[k])),
    step,
    maxStep,
  };
}

// ── avatar-upload.ts: the local check before any request ─────────────────
const AVATAR_CONTENT_TYPES = Object.freeze(["image/jpeg", "image/png", "image/webp"]);
const AVATAR_CLIENT_MAX_BYTES = 4 * 1024 * 1024;
const AVATAR_EXT_FOR_TYPE = Object.freeze({ "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" });

/** `image/JPG; charset=x` → `image/jpeg`; an untyped blob is taken as JPEG. */
function normalizeAvatarContentType(type) {
  const t = typeof type === "string" ? type.split(";")[0].trim().toLowerCase() : "";
  if (t === "" || t === "image/jpg") return "image/jpeg";
  return t;
}

/** A readable size, an allowed type, under the cap. */
function preflightAvatarBlob(blob) {
  const size = blob ? blob.size : undefined;
  if (typeof size !== "number" || !Number.isFinite(size) || size <= 0) {
    return { ok: false, message: PHOTO_ERROR_COPY.processFailed };
  }
  const contentType = normalizeAvatarContentType(blob ? blob.type : undefined);
  if (!AVATAR_CONTENT_TYPES.includes(contentType)) {
    return { ok: false, message: PHOTO_ERROR_COPY.wrongType };
  }
  if (size > AVATAR_CLIENT_MAX_BYTES) {
    return { ok: false, message: PHOTO_ERROR_COPY.tooBig };
  }
  return { ok: true, contentType };
}

// ── Small safety helpers ──────────────────────────────────────────────────

/** login-next.ts: a same-origin relative path only (the open-redirect gate). */
function isSafeRelativePath(next) {
  if (typeof next !== "string" || next.length === 0) return false;
  if (next[0] !== "/") return false;
  if (next[1] === "/" || next[1] === "\\") return false;
  if (next.includes("\\")) return false;
  if (/[\s\x00-\x1f\x7f]/.test(next)) return false;
  try {
    return new URL(next, "https://x.invalid").origin === "https://x.invalid";
  } catch (e) {
    return false;
  }
}

/** An image source this page may set: https://…, or a same-origin /path (never //host or /\host). */
function safeImgSrc(v) {
  if (typeof v !== "string") return null;
  if (v.startsWith("https://")) return v;
  if (v.startsWith("/") && !v.startsWith("//") && !v.startsWith("/\\")) return v;
  return null;
}

/** "Franky" from "Franky Cazares"; null when there's no name to show. */
function firstName(full) {
  const trimmed = typeof full === "string" ? full.trim() : "";
  return trimmed ? trimmed.split(/\s+/)[0] || null : null;
}
/* ONB-PURE-MIRROR:END */

// ── Page state ────────────────────────────────────────────────────────────
const ONB_USER_ID = draftKey(ONB_BOOT.userId) ? ONB_BOOT.userId : null;

/** The stored draft, or null; an unreadable or expired one is removed. Never in replay. */
function loadStoredDraft() {
  if (IS_REPLAY || !ONB_USER_ID) return null;
  const key = draftKey(ONB_USER_ID);
  let raw = null;
  try {
    raw = localStorage.getItem(key);
  } catch (e) {
    return null;
  }
  if (raw === null) return null;
  const record = readDraftRecord(raw, Date.now());
  if (!record) {
    try { localStorage.removeItem(key); } catch (e) { /* storage blocked */ }
  }
  return record;
}

const ONB_RESTORE = restoreOnboarding({
  replay: IS_REPLAY,
  draft: loadStoredDraft(),
  system: ONB_BOOT.system,
  prefill: ONB_PREFILL,

  blobUrl: null,

  done: false,

  continueOnLand: null,

/** The single-campus preselect from the email, when it's one of this university's campuses. */

// ── Copy ──────────────────────────────────────────────────────────────────
function copyAt(root, path) {
  return String(path || '').split('.').reduce((o, k) => (o && typeof o === 'object' ? o[k] : undefined), root);
}

/** Every static string on the page, from the copy tables (textContent only). */
function applyCopy() {
  document.querySelectorAll('[data-copy]').forEach((el) => {
    const t = copyAt(ONB_COPY, el.getAttribute('data-copy'));
    if (typeof t === 'string') el.textContent = t;
  });
  document.querySelectorAll('[data-local]').forEach((el) => {
    const t = copyAt(ONB_LOCAL_COPY, el.getAttribute('data-local'));
    if (typeof t === 'string') el.textContent = t;
  });
  document.querySelectorAll('[data-placeholder]').forEach((el) => {
    const t = copyAt(ONB_LOCAL_COPY, el.getAttribute('data-placeholder'));

  $('onbBack').setAttribute('aria-label', ONB_COPY.header.back);
  $('onbPurdueEmail').placeholder = ONB_COPY.campus.switchPlaceholder;
  $('onbClubsSearch').placeholder = ONB_COPY.clubs.search;
  $('onbClubsSearch').setAttribute('aria-label', ONB_COPY.clubs.search);

  const year = $('pfYear');
  ONB_LOCAL_COPY.yearOptions.forEach((o) => {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    year.appendChild(opt);
  });
  const looking = $('pfLookingWrap');
  ONB_LOCAL_COPY.lookingFor.forEach((o) => {
    const row = document.createElement('label');
    row.className = 'pf-looking-row';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.className = 'pf-looking';
    box.value = o.value;
    const text = document.createElement('span');
    text.textContent = o.label;
    row.appendChild(box);
    row.appendChild(text);
    looking.appendChild(row);
  });
}

// ── Cursor (matches the rest of vibe) ─────────────────────────────────────
// Dot written straight from mousemove; ring on a time-based curve (90% of a
// jump in ~40ms at any refresh rate) whose loop stops once it has caught up.
// Same follow as src/components/CustomCursor.tsx.
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx = 0, my = 0, rx = 0, ry = 0, ringRaf = 0, ringLast = 0;
function animateRing(t) {
  const dt = ringLast ? Math.min(t - ringLast, 64) : 16.7;
  ringLast = t;
  const a = 1 - Math.exp(-dt / 17);
  rx += (mx - rx) * a; ry += (my - ry) * a;
  ring.style.transform = `translate3d(${rx-14}px, ${ry-14}px, 0)`;
  if (Math.abs(mx - rx) + Math.abs(my - ry) < 0.2) { ringRaf = 0; ringLast = 0; }
  else ringRaf = requestAnimationFrame(animateRing);
}
ring.style.transform = `translate3d(${rx-14}px, ${ry-14}px, 0)`;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cur.style.transform = `translate3d(${mx-4}px, ${my-4}px, 0)`; if (!ringRaf) ringRaf = requestAnimationFrame(animateRing); });
let cursorHoverEl = null;
function bindCursorHover() {
  document.querySelectorAll('button, a, input, select, textarea, .pf-looking-row, .campus-card').forEach(el => {
    if (el.dataset.cursorBound) return;
    el.dataset.cursorBound = '1';
    el.addEventListener('mouseenter', () => { cursorHoverEl = el; cur.classList.add('hover'); ring.classList.add('hover'); });
    el.addEventListener('mouseleave', () => { if (cursorHoverEl === el) cursorHoverEl = null; cur.classList.remove('hover'); ring.classList.remove('hover'); });
  });
  // A re-render can remove the element under the pointer, which never gets
  // its mouseleave: drop the hover look (the next element entered sets it again).
  if (cursorHoverEl && !cursorHoverEl.isConnected) {
    cursorHoverEl = null;
    cur.classList.remove('hover');
    ring.classList.remove('hover');
  }
}


// ── Steps, history and busy ───────────────────────────────────────────────
// Every pushState / replaceState keeps the entry's own state and adds
// `onbStep`, with NO url: the iframe's URL never changes. The onboarding
// entries are always steps 1, 2, 3, … in order, so an entry's `onbStep` is
// also its depth, and the distance between two steps is their difference.
// Moves that must not happen are undone with history.go back to where the
// student was, never by rewriting the entry they landed on.

function stepState(n) {
  return Object.assign({}, history.state, { onbStep: n });
}
function pushStep(n) { history.pushState(stepState(n), ''); }
function replaceStep(n) { history.replaceState(stepState(n), ''); }

function updateProgress() {
  document.querySelectorAll('#progressDots .dot').forEach((d, i) => {
    d.classList.remove('done', 'now');
    if (i + 1 < onb.step) d.classList.add('done');
    else if (i + 1 === onb.step) d.classList.add('now');
  });
  $('progressText').textContent = ONB_COPY.header.progress.replace('{n}', String(onb.step));
}

/** Show step `n`. Never focuses anything: focus on step entry scrolls the header away. */
function showStep(n) {
  onb.step = n;
  document.querySelectorAll('.onb-step').forEach((el) => {
    el.classList.toggle('active', Number(el.dataset.step) === n);
  });
  const curStep = document.querySelector('.onb-step.active');
  if (curStep) { curStep.style.animation = 'none'; curStep.offsetHeight; curStep.style.animation = ''; }
  updateProgress();
  $('onbBack').style.visibility = n <= 1 ? 'hidden' : 'visible';
  bindCursorHover();
  window.scrollTo({ top: 0 });
  scheduleDraft();
  if (n === 3) refreshMajorList();
  if (n === 5 && onb.clubs.status === 'idle') loadClubs();
  if (n === 6) {
    renderPeopleOtto();
    if (onb.people.status === 'idle') loadPeople();
  }
}

/** Always the next step, so each step keeps one entry. */
function goForward(n) {
  pushStep(n);
  onb.maxStep = Math.max(onb.maxStep, n);
  showStep(n);
}

/** Back to an earlier step from Finish, through history (busy is already cleared). */
function sendBack(target) {
  const delta = target - onb.step;
  if (delta < 0) history.go(delta);
}

function setBusy(flag, value) {
  onb[flag] = value;
  renderBusy();
}

/** Back, Skip, the logo's leave and every footer button hold still while anything saves. */
function renderBusy() {
  const busy = isBusy();
  $('onbBack').disabled = busy;
  $('onbSkip').disabled = busy || onb.skipOpen;
  document.querySelectorAll('.onb-cta').forEach((b) => { b.disabled = busy; });
  document.querySelectorAll('#onbCampusGroup input').forEach((r) => { r.disabled = busy; });
  $('onbCampusContinue').textContent = onb.savingCampus ? ONB_COPY.campus.saving : ONB_COPY.campus.continue;
  $('onbProfileContinue').textContent = onb.savingProfile ? ONB_COPY.profile.saving : ONB_COPY.profile.continue;
  $('onbFinish').textContent = onb.finishing ? ONB_COPY.people.finishing : ONB_COPY.people.finish;
  renderPurdue();
  renderPhoto();
  renderClubsFooter();
  renderSkip();
}

function onPopState(e) {
  const raw = e.state && e.state.onbStep;
  const at = typeof raw === 'number' && Number.isInteger(raw) && raw >= 1 ? raw : null;
  const current = onb.step;
  const pending = onb.continueOnLand;
  onb.continueOnLand = null;

  // Not an onboarding entry: Back from step 1, on the way out.
  if (at === null) {
    if (!isBusy()) {
      if (onb.skipOpen) closeSkip();
      if (current !== 1) showStep(1);
    }
    return;
  }

  // The undo of a Forward past unsaved changes (below) has landed.
  if (pending !== null && at === pending && current === pending) {
    if (!isBusy()) void (pending === 2 ? continueCampus() : continueProfile());
    return;
  }

  // Any other landing back on this step (an undo below): nothing moved.
  if (at === current) return;

  // Mid-save: undo the move and stay put. A Back re-adds the steps it left.
  if (isBusy()) {
    if (at < current) {
      for (let s = at + 1; s <= current; s++) pushStep(s);
    } else {
      history.go(current - at);
    }
    return;
  }

  // Past every step reached so far: go back to where the student is.
  if (at > onb.maxStep) {
    history.go(current - at);
    return;
  }

  // Forward past a campus or profile step with unsaved changes: go back to
  // that step and run its Continue, so nothing is skipped unsaved.
  if (!IS_REPLAY && at > current) {
    const campusUnsaved = current === 2 && onb.system !== null && onb.campusId !== onb.savedCampusId;
    const profileUnsaved = current === 3 && (onb.profileDirty || !onb.identitySaved);
    if (campusUnsaved || profileUnsaved) {
      onb.continueOnLand = current;
      history.go(current - at);
      return;
    }
  }

  if (onb.skipOpen) closeSkip();
  showStep(at);
}

/** Once per load: a back stack down to step 1 (or the reload's own entries). */
function buildHistoryStack() {
  const target = onb.step;
  const raw = history.state && history.state.onbStep;
  const at = typeof raw === 'number' && Number.isInteger(raw) && raw >= 1 ? raw : null;
  if (at === null) {
    replaceStep(1);
    for (let s = 2; s <= target; s++) pushStep(s);
  } else if (at > target) {
    // A reload that restores an earlier step than this entry: its own entry is below.
    history.go(target - at);
  } else {
    for (let s = at + 1; s <= target; s++) pushStep(s);
  }
}

// ── Draft (never in replay, only with a user id, never after Finish/Skip) ──
let draftTimer = null;
let draftPending = null;

function scheduleDraft() {
  if (IS_REPLAY || !ONB_USER_ID || onb.done) return;
  const f = readFields();
  // The photo is never in the draft: the server holds it.
  draftPending = {
    step: onb.step,
    maxStep: onb.maxStep,
    fields: {
      campus_id: onb.campusId,
      name: f.name,
      handle: f.handle,
      bio: f.bio,
      major: f.major,
      department: f.department,
      year: f.year,
      interests: f.interests,
      skills: f.skills,
      looking_for: f.looking_for,
    },
  };
  clearTimeout(draftTimer);
  draftTimer = setTimeout(flushDraft, DRAFT_SAVE_DELAY_MS);
}

function flushDraft() {
  clearTimeout(draftTimer);
  draftTimer = null;
  const pending = draftPending;
  draftPending = null;
  if (!pending || IS_REPLAY || !ONB_USER_ID || onb.done) return;
  const record = buildDraftRecord(pending, Date.now());
  if (!record) return;
  try {
    localStorage.setItem(draftKey(ONB_USER_ID), JSON.stringify(record));
  } catch (e) {
    /* storage blocked or full: the server copies still hold what was saved */
  }
}

function clearDraftNow() {
  clearTimeout(draftTimer);
  draftTimer = null;
  draftPending = null;
  onb.done = true;
  if (!ONB_USER_ID) return;
  try {
    localStorage.removeItem(draftKey(ONB_USER_ID));
  } catch (e) {
    /* storage blocked: nothing to remove */
  }
}

function toastFailure(r) {

}

/** Otto's saved config. Any non-empty otto_answers marks onboarding done. */
