<!doctype html>
<!--
  Vibe's offline page. public/sw.js precaches this one file and shows it only
  when a page load fails because the network is gone.

  EDITED THIS FILE? Bump SW_VERSION in public/sw.js in the same commit. Phones
  keep the copy their worker cached at install, and only a new worker (new
  sw.js bytes) fetches a fresh one.

  Rules, because this page is served when nothing else can be fetched:
  - Fully self-contained: inline CSS, the logo as inline SVG, system fonts.
    No images, stylesheets, fonts or scripts from anywhere, this site
    included. Only this file is cached, so any other file would be missing
    exactly when the page shows. scripts/check-pwa.mjs fails on any
    subresource here.
  - Neutral words, no names: it shows to whoever is holding the phone.
  - Layout-neutral: it can also appear inside the desktop messages and
    onboarding iframes.
-->
<html lang="en">
<head>
<script>(function(){try{var k="vibe_theme",p=null;try{p=localStorage.getItem(k)}catch(e){}if(p!=="light"&&p!=="dark"&&p!=="system")p="system";if(p==="system")p=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=p}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="robots" content="noindex">
<title>Vibe · Offline</title>
<style>
  /* Vibe's tokens (S67 contracts C0): cream/ink in Light, the Night column
     under data-theme="dark", which the head script sets before paint. */
  :root {
    --cream: #FAF7F2;
    --charcoal: #1C1C1E;
    --ink-2: #5C5853;
    --coral: #FF5C35;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --cream: #0C0B0B;
    --charcoal: #F6F1EA;
    --ink-2: #CFC8BE;
  }
  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px
      calc(24px + env(safe-area-inset-bottom, 0px));
    /* Local font names only: if the student's device happens to have them
       installed they're used, otherwise the system face. Nothing is fetched. */
    font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 320px;
  }
  /* The word is 804 by 297 in its own units: 130 wide is 48 tall. */
  .mark {
    display: block;
    width: 130px;
    height: 48px;
    margin: 0 auto 22px;
  }
  h1 {
    margin: 0 0 8px;
    font-family: Fraunces, Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0 0 22px;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink-2);
  }
  /* The letters of the mark: ink on the page, so they stay visible in Night. */
  .mark .glyph {
    fill: var(--charcoal);
  }
  button {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--coral);
    /* Dark words on the orange button (6.3:1); cream on orange was 2.9:1.
       A plain value: this page has no --on-coral token. Same in both looks. */
    color: #160A06;
    box-shadow: 0 6px 18px rgba(255, 92, 53, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  button:focus-visible {
    outline: 2px solid var(--charcoal);
    outline-offset: 3px;
  }
</style>
</head>

  <h1>You're offline</h1>
  <p>Vibe will reload when you're back.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  // The worker serves this page IN PLACE of the one that failed, so the
  // address bar still says /campus or /messages and a reload retries that
  // page. Someone who opened this file by its own address would only reload
  // the offline page, so they go to the campus instead.
  function tryAgain() {
    if (location.pathname === "/offline.html") location.replace("/campus");
    else location.reload();
  }
  document.getElementById("retry").addEventListener("click", tryAgain);
  window.addEventListener("online", tryAgain);
</script>
