<!doctype html>
<!--
  Capacitor needs a webDir with an index.html, but the store apps never show
  this page: capacitor.config.ts sets server.url, so the web view opens the
  live site instead. It exists so a broken or stale config still lands on
  Vibe rather than on a blank screen. The address is absolute because this
  file is served from the app's own local origin, where "/campus" would
  mean nothing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vibe</title>
<style>
  html, body { margin: 0; background: #FAF7F2; }
</style>
<script>
  location.replace("https://www.connectvibe.app/campus");
</script>
</head>
<body></body>
</html>
