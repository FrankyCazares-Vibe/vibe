<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 2 · Your club · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300..800;1,400&amp;family=Fraunces:ital,wght,SOFT@0,400..900,100;1,400,100&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#0C0B0B}
button,input{font:inherit;color:inherit;background:transparent;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
svg{display:block}
input::placeholder{color:#9C958C;opacity:1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; background: #0C0B0B; color: #F6F1EA; font-family: 'DM Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(560px 420px at 100% 0%, rgba(255,92,53,0.18), transparent 60%), radial-gradient(620px 560px at 0% 100%, rgba(255,92,53,0.24), rgba(255,92,53,0.05) 45%, transparent 70%)"></div>

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px">
    <button type="button" aria-label="Switch club" aria-haspopup="dialog" style="flex: 1; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; text-align: left">
      <span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 999px; background: linear-gradient(135deg, #2A8A8E, #1C5E62); display: flex; align-items: center; justify-content: center; font-family: Fraunces, serif; font-weight: 800; font-size: 15px; flex-shrink: 0">SC</span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="display: flex; align-items: center; gap: 6px">
          <span style="font-family: Fraunces, serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Sixty-Four Chess</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CFC8BE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #FF5C35"></span>
        </span>
        <span style="font-size: 13px; color: #9C958C">Owner · 41 followers · 23 members</span>
      </span>
    </button>
    <button type="button" aria-label="Share the club" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg></button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 16px">
    <section aria-label="Needs you" style="border-radius: 14px; background: rgba(22,21,21,0.86); border: 1px solid rgba(255,255,255,0.07); padding: 6px 6px 6px 14px; display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="width: 9px; height: 9px; border-radius: 999px; background: #FF5C35; flex-shrink: 0"></div>
      <div style="flex: 1; font-size: 15px">2 people want to join</div>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-size: 14px; font-weight: 600">Review</button>
    </section>

    <section aria-label="Up next" style="border-radius: 18px; padding: 16px; background: rgba(22,21,21,0.92); border: 1px solid rgba(255,92,53,0.55); box-shadow: 0 0 28px rgba(255,92,53,0.2); display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 13px; color: #CFC8BE">Up next · Thu · 7 PM · The Lantern Room</div>
        <div style="font-size: 13px; color: #F6C468; white-space: nowrap">In 2 days</div>
      </div>
      <div style="font-family: Fraunces, serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1.05">Blitz Night</div>
      <ol aria-label="Steps" style="list-style: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{steps}}" as="t" hint-placeholder-count="5">
          <li style="display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center">
            <div aria-hidden="true" style="width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{t.bg}}; border: 1.5px solid {{t.ring}}; color: {{t.ink}}"><sc-if value="{{t.done}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></sc-if><sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">{{t.mark}}</sc-if></div>
            <div style="font-size: 11.5px; line-height: 1.2; color: {{t.label}}">{{t.name}}</div>
          </li>
        </sc-for>
      </ol>
      <div style="font-size: 14px; color: #E4DDD3"><strong>14</strong> going · <strong>6</strong> interested</div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; border-radius: 999px; background: #FF5C35; color: #160A06; font-weight: 700; font-size: 15px">Share the event</button>
        <button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-weight: 600; font-size: 15px">Edit</button>
      </div>
    </section>

    <section aria-label="Write to members" style="border-radius: 16px; background: rgba(22,21,21,0.86); border: 1px solid rgba(255,255,255,0.07); padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 6px">
        <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F6F1EA; color: #0C0B0B; font-size: 14px; font-weight: 600">Post</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-size: 14px; font-weight: 600">New event</button>
        <button type="button" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); font-size: 14px; font-weight: 600">Poll</button>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <label for="r2-write" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Write to members</label>
        <input id="r2-write" type="text" placeholder="Write to members…" style="flex: 1; min-width: 0; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 0 16px; font-size: 15px">
        <button type="button" aria-label="Send to the Board" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
      </div>
      <div style="font-size: 12.5px; color: #9C958C">Goes on the Board. Members and followers read it.</div>
    </section>

    <a href="#" style="min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.09); padding: 0 16px; display: flex; align-items: center; gap: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC8BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="flex: 1; font-size: 15px">Club tools</span>
      <span style="font-size: 13px; color: #9C958C">People, share, settings</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9C958C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </main>

  <nav aria-label="Tabs" style="flex-shrink: 0; height: 84px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(12,11,11,0.96); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding-top: 10px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: {{t.color}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Posted', 'Going', 'Check-in', 'Who came', 'Thank-you'];
    const cur = 1;
    const steps = names.map((name, i) => {
      if (i < cur) return { name, done: true, open: false, mark: '', bg: '#F6F1EA', ring: '#F6F1EA', ink: '#0C0B0B', label: '#CFC8BE' };
      if (i === cur) return { name, done: false, open: true, mark: String(i + 1), bg: 'rgba(255,92,53,0.18)', ring: '#FF5C35', ink: '#FF8A66', label: '#FF8A66' };
      return { name, done: false, open: true, mark: String(i + 1), bg: 'transparent', ring: 'rgba(255,255,255,0.22)', ink: '#9C958C', label: '#9C958C' };
    });
    return {
      steps,
      tabs: [
        { label: 'Campus', color: '#9C958C', icon: 'M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6z' },
        { label: 'Network', color: '#9C958C', icon: 'M12 7a3 3 0 1 0 0-.01M5 19a3 3 0 1 0 0-.01M19 19a3 3 0 1 0 0-.01M10.5 9.5l-4 7M13.5 9.5l4 7M8 19h8' },
        { label: 'otto', color: '#9C958C', icon: 'M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z' },
        { label: 'Messages', color: '#9C958C', icon: 'M4 5h16v11H9l-5 4z' },
        { label: 'Club', color: '#F6F1EA', icon: 'M5 21V4M5 4h12l-2.5 4L17 12H5' },
        { label: 'Profile', color: '#9C958C', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' }
      ]
    };
  }
}
</script>
</body>
</html>
